version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - misspell
    - unconvert
    - gocyclo
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - gen/
      - third_party/
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [gosec]
        rules: [G115]
