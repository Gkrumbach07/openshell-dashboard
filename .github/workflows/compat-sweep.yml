# Gateway compatibility sweep (ADR 0006, which amends ADR 0005).
#
# ci.yml's `compat` job answers "do we still work with the range we claim?" on
# every PR. This workflow looks further, on a schedule, along TWO INDEPENDENT
# AXES. Each axis holds the other side still, so a result always says which
# link of gateway -> SDK -> BFF it is about:
#
#   gateway axis  SDK held at the pin in backend/go.mod; the gateway image
#                 varies. "Which gateways does the code we ship today work
#                 with?" A failure is on the WIRE link (gateway<->SDK).
#                 PR: deploy/ci/gateway-pins.json only (the ceiling lane).
#
#   sdk axis      Gateways held at the required lanes; the SDK varies. "Can we
#                 move to a newer SDK without losing a gateway we support?"
#                 Build/vet/unit tests prove the SOURCE link (SDK<->BFF) first,
#                 then the compat suite proves the wire link on every lane.
#                 PR: backend/go.mod, backend/go.sum and the `sdk` field only.
#
# (Either PR also regenerates the block of README.md that restates the range,
# when the repository has scripts/readme-gateway-range.mjs. Nothing else.)
#
# The previous version moved the SDK and the gateway together and reported the
# outcome as gateway compatibility. One SDK compile error then read as "3
# releases need migration" (#75) for three gateways that worked.
#
# Invariants. Each is enforced in code, not only stated here:
#   1. An automated PR changes exactly one axis.     sweep.py check-diff (guard.py)
#   2. dev / HEAD and @latest are never pinned.      outcomes.py, pins.py
#   3. Every compat run uses -count=1.               tests/test_workflows.py
#   4. Release lanes are pinned by digest.           pins.py validate
#   5. No ${{ }} inside a run: script; values        tests/test_workflows.py
#      reach scripts through env:.
#   6. Least-privilege permissions per job.          tests/test_workflows.py
#   7. The job that can write (bump) executes        tests/test_workflows.py
#      nothing from upstream or from the candidate
#      SDK, and only its push / gh steps see a
#      token.
#   8. The ceiling never moves past a release that   outcomes.py, candidates.py
#      failed or that the run has no result for.
#   9. Only a pull request whose head is in THIS     prs.py
#      repository is ever rewritten or closed.
#
# All decision logic lives in deploy/ci/sweep/ with unit tests. This file only
# checks out, sets up toolchains, starts containers and calls `gh`.
#
# BEFORE THIS WORKFLOW CAN OPEN A PULL REQUEST, one of these must be true. As
# of 2026-10-05 neither is, so a run that has something to propose fails in
# the bump job with a message that says so:
#   a. Settings > Actions > General > Workflow permissions > "Allow GitHub
#      Actions to create and approve pull requests" is enabled; or
#   b. the repository has a secret SWEEP_TOKEN: a fine-grained or GitHub App
#      token with Contents and Pull requests read/write on this repository.
# With (b) CI also starts on the PR by itself; with (a) alone a person has to
# start it (the PR body says how).
#
# A red run means the sweep itself broke, or could not open a PR. Findings
# never turn it red: they go to one issue (rewritten in place, closed when
# nothing is outstanding) and to at most one PR per axis. Nothing is ever
# merged automatically.
name: Compat sweep

on:
  schedule:
    # Every day at 06:00 UTC. Upstream cut 0.1.0, 0.1.1 and 0.1.2 inside four
    # days, so a weekly look can be three releases behind. A run takes about six
    # minutes, reports to one issue that is rewritten in place, and keeps at
    # most one pull request per axis, so running daily adds no noise.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max_versions:
        description: "Gateway axis: narrow to the newest N releases at or below the ceiling (empty = all of them). Releases above the ceiling are always swept. A narrowed run never closes the issue."
        required: false
        default: ""
      include_head:
        description: "Also probe upstream HEAD (gateway dev, sdk@latest) as early warning. A run without it never closes the issue."
        type: choice
        options: ["1", "0"]
        default: "1"
      since:
        description: "Gateway axis: also sweep back to this release, below the floor (informational, e.g. 0.0.116)"
        required: false
        default: ""

# Nothing by default. Every job asks for exactly what it uses.
permissions: {}

# The issue and the two PR branches are singletons; two sweeps that can write
# them would fight over them, so runs on main queue behind each other. A run
# from any other ref is a dry run that touches none of them. It gets a group
# of its own: GitHub keeps only ONE pending run per group, so two dry runs in
# the shared group could cancel the scheduled sweep that was waiting its turn.
concurrency:
  group: compat-sweep-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  SWEEP: python3 deploy/ci/sweep/sweep.py

jobs:
  plan:
    name: Plan both axes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gateway_matrix: ${{ steps.plan.outputs.gateway_matrix }}
      gateway_count: ${{ steps.plan.outputs.gateway_count }}
      sdk_matrix: ${{ steps.plan.outputs.sdk_matrix }}
      sdk_count: ${{ steps.plan.outputs.sdk_count }}
    steps:
      - uses: actions/checkout@v4

      # Go turns an SDK query (a release tag's commit, @latest) into the exact
      # version it would write to go.mod. Resolved once here, so every leg
      # tests the same SDK even if upstream HEAD moves during the run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Unit-test the sweep logic
        run: python3 -m unittest discover -s deploy/ci/sweep

      - name: Discover candidates
        id: plan
        env:
          # Empty on a scheduled run: every release from the floor up.
          MAX_VERSIONS: ${{ inputs.max_versions }}
          INCLUDE_HEAD: ${{ inputs.include_head || '1' }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          $SWEEP plan --max-versions "$MAX_VERSIONS" --include-head "$INCLUDE_HEAD" \
            --since "$SINCE" --out /tmp/sweep/plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-plan
          path: /tmp/sweep/plan.json
          retention-days: 7

  # Gateway axis, part 1: the code we ship, built ONCE from the checked-in
  # go.mod. Every gateway leg runs this same binary, so the only thing that
  # differs between legs is the gateway.
  bff:
    name: Build the BFF we ship
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # backend/go.mod is never modified on the gateway axis. With
      # -mod=readonly Go refuses to, and the diff below proves it did not.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build from the checked-in go.mod
        run: |
          set -euo pipefail
          (cd backend && go build -o ../bin/server ./cmd/server)
          git diff --exit-code -- backend/go.mod backend/go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-bff
          path: bin/server
          if-no-files-found: error
          retention-days: 1

  # Gateway axis, part 2: one leg per candidate gateway. The images are the
  # tag@digest references the plan resolved, so a later PR pins exactly what
  # was tested here.
  gateway:
    name: gateway ${{ matrix.version }} x the SDK we pin
    needs: [plan, bff]
    if: needs.plan.outputs.gateway_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gateway_matrix) }}
    env:
      LEG: ${{ toJSON(matrix) }}
      OPENSHELL_GATEWAY_IMAGE: ${{ matrix.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ matrix.supervisor_image }}
      # A sweep crosses config-schema boundaries and cannot know in advance
      # which side a release sits on. The stack reports what the gateway took.
      OPENSHELL_CONFIG_SCHEMA: auto
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      # For `go test` only: the BFF under test is the downloaded binary.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: sweep-bff
          path: bin

      # From here on a failing step is a RESULT, not an error, so it must not
      # fail the leg. Each of the next four needs the one before it, and the
      # first that does not succeed names what happened: an image that cannot
      # be pulled, a gateway that never starts and a BFF that never becomes
      # healthy are all recorded as "could not be tested" - no request reached
      # the gateway, so they say nothing about either link. If they failed the
      # leg instead, a failure that repeats on every run would be reported
      # forever as "the leg did not report; re-run the sweep".
      - name: Pull images
        id: pull
        continue-on-error: true
        run: |
          set -euo pipefail
          # Same digest-pinned workload image as the PR lanes: this axis varies
          # the gateway, not the workload.
          COMPAT_SANDBOX_IMAGE=$(jq -er '.sandbox_image' deploy/ci/gateway-pins.json)
          echo "COMPAT_SANDBOX_IMAGE=$COMPAT_SANDBOX_IMAGE" >> "$GITHUB_ENV"
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # When the gateway does not become healthy, e2e-stack.sh prints its log
      # itself, before it tears the stack down: afterwards there is no
      # container left to ask.
      - name: Start gateway stack
        id: stack
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        id: bff
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x bin/server
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: the suite talks to a live gateway, which Go's test cache
      # cannot see. A cached pass must never stand in for this gateway.
      - name: Run compat suite
        id: compat
        if: steps.bff.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -timeout 20m ./test/compat/...

      # A leg that broke for its own reasons before this point uploads
      # nothing, and the report reads a missing result as unknown - never as a
      # pass or a failure.
      - name: Record result
        env:
          PULL: ${{ steps.pull.outcome }}
          STACK: ${{ steps.stack.outcome }}
          BFF: ${{ steps.bff.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
          CONFIG_SCHEMA: ${{ steps.stack.outputs.config_schema }}
        run: |
          set -euo pipefail
          $SWEEP record-gateway --leg "$LEG" --pull "$PULL" --stack "$STACK" --bff "$BFF" \
            --compat "$COMPAT" --config-schema "$CONFIG_SCHEMA" --out /tmp/sweep/results

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-result-${{ matrix.id }}
          path: /tmp/sweep/results/*.json
          if-no-files-found: error
          retention-days: 7

      # Only while the stack is still up. A gateway that never started has
      # already printed its log from inside e2e-stack.sh.
      - name: Gateway logs
        if: always() && (steps.bff.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # SDK axis: one leg per candidate SDK x required lane. The gateway images are
  # the lanes exactly as pinned; they are never modified on this axis.
  #
  # This is the job that runs the candidate SDK's code (`go test` links and
  # executes it), which is why it can read the repository and nothing else.
  sdk:
    name: sdk ${{ matrix.sdk_label }} x gateway ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.sdk_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.sdk_matrix) }}
    env:
      LEG: ${{ toJSON(matrix) }}
      SDK_VERSION: ${{ matrix.sdk_version }}
      OPENSHELL_GATEWAY_IMAGE: ${{ matrix.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ matrix.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ matrix.config_schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The SOURCE link, before any gateway is involved: go get, go mod tidy,
      # go build, go vet, go test. When build, vet or test fails the outcome is
      # source_incompatible and the compiler's output goes into the report as
      # a source migration - explicitly not as a gateway problem. When get or
      # tidy fails the SDK could not be fetched or resolved, which is the
      # network as often as the SDK, and the report says that instead.
      - name: Source link (move the SDK; build, vet and unit-test the BFF)
        id: source
        continue-on-error: true
        run: |
          set -euo pipefail
          $SWEEP sdk-source-check --sdk-version "$SDK_VERSION" --log /tmp/sweep/source.log

      - name: Build the BFF against this SDK
        if: steps.source.outcome == 'success'
        run: cd backend && go build -o ../bin/server ./cmd/server

      - name: Pull images
        id: pull
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          COMPAT_SANDBOX_IMAGE=$(jq -er '.sandbox_image' deploy/ci/gateway-pins.json)
          echo "COMPAT_SANDBOX_IMAGE=$COMPAT_SANDBOX_IMAGE" >> "$GITHUB_ENV"
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # The WIRE link: the BFF built against the candidate SDK, run against a
      # gateway we already support.
      - name: Start gateway stack
        id: stack
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        id: bff
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: see the gateway axis. Four legs share a restored GOCACHE.
      - name: Run compat suite
        id: compat
        if: steps.bff.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -timeout 20m ./test/compat/...

      - name: Record result
        env:
          SOURCE: ${{ steps.source.outcome }}
          SOURCE_STEP: ${{ steps.source.outputs.step }}
          PULL: ${{ steps.pull.outcome }}
          STACK: ${{ steps.stack.outcome }}
          BFF: ${{ steps.bff.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
        run: |
          set -euo pipefail
          $SWEEP record-sdk --leg "$LEG" --source "$SOURCE" --source-step "$SOURCE_STEP" \
            --source-log /tmp/sweep/source.log --pull "$PULL" --stack "$STACK" --bff "$BFF" \
            --compat "$COMPAT" --out /tmp/sweep/results

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-result-${{ matrix.id }}
          path: /tmp/sweep/results/*.json
          if-no-files-found: error
          retention-days: 7

      # The go.mod and go.sum this leg built and tested, for the SDK PR. The
      # bump job copies them in instead of running `go` again: it holds a
      # write token, and `go test` would run the candidate SDK's code beside
      # it. Only the release SDK can become a PR; @latest never does.
      - name: Keep the go.mod and go.sum this leg proved
        if: steps.compat.outcome == 'success' && matrix.sdk_id == 'sdk-release'
        uses: actions/upload-artifact@v4
        with:
          name: sweep-sdk-gomod-${{ matrix.id }}
          path: |
            backend/go.mod
            backend/go.sum
          if-no-files-found: error
          retention-days: 7

      - name: Gateway logs
        if: always() && (steps.bff.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # Classifies what came back and maintains the one issue. Runs even when legs
  # failed or nothing was swept: an open issue must not go stale, and a run
  # with nothing outstanding must leave nothing open.
  #
  # !cancelled(), not always(): always() is true for a cancelled run too, so
  # pressing Cancel would not have stopped this job from rewriting the issue.
  report:
    name: Report
    needs: [plan, gateway, sdk]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      gateway_pr: ${{ steps.report.outputs.gateway_pr }}
      sdk_pr: ${{ steps.report.outputs.sdk_pr }}
      incomplete: ${{ steps.report.outputs.incomplete }}
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Anything but main writes nothing: no issue, no branch, no PR.
      DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sweep-plan
          path: /tmp/sweep
      - uses: actions/download-artifact@v4
        # No result at all is a state the report handles (every row "no result").
        continue-on-error: true
        with:
          pattern: sweep-result-*
          path: /tmp/sweep/results
          merge-multiple: true

      - name: Classify and render
        id: report
        run: |
          set -euo pipefail
          mkdir -p /tmp/sweep/results
          $SWEEP report --plan /tmp/sweep/plan.json --results /tmp/sweep/results \
            --run-url "$RUN_URL" --repo-url "$REPO_URL" --dry-run "$DRY_RUN" --out /tmp/sweep/report
          cat /tmp/sweep/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-decision
          path: /tmp/sweep/report/decision.json
          if-no-files-found: error
          retention-days: 7

      # main only: a manual run from another branch is a dry run. It reports to
      # the step summary and changes nothing.
      - name: Maintain the issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.report.outputs.issue_action }}
        run: |
          set -euo pipefail
          # Found by label, not by title: the title changes with the findings.
          # Only OPEN issues count, so closing one means "handled".
          gh label create compat-migrate --color b60205 --force \
            --description "Compat sweep: a gateway<->SDK or SDK<->BFF link needs a person" >/dev/null 2>&1 || true
          num=$(gh issue list --label compat-migrate --state open --json number --jq '.[0].number // empty')
          case "$ACTION" in
            upsert)
              title=$(cat /tmp/sweep/report/issue-title.txt)
              if [ -n "$num" ]; then
                gh api --method PATCH "repos/$GH_REPO/issues/$num" --silent \
                  -f title="$title" -F body=@/tmp/sweep/report/issue-body.md
                echo "rewrote issue #$num"
              else
                gh issue create --label compat-migrate --title "$title" \
                  --body-file /tmp/sweep/report/issue-body.md
              fi
              ;;
            close)
              if [ -n "$num" ]; then
                gh issue close "$num" --comment "Nothing is outstanding on either axis in $RUN_URL, which swept the whole supported range and upstream HEAD. Closing; the next sweep that finds something opens a fresh issue."
              else
                echo "nothing outstanding and no issue open"
              fi
              ;;
            *)
              # keep: a leg did not report, a release above the ceiling has no
              # result, or the run was narrowed by hand. The summary says which.
              echo "::notice::This run did not look at everything, so the issue was left exactly as it is (see the summary)."
              ;;
          esac

  # At most one PR per axis, each on a fixed branch that is force-pushed, so a
  # later sweep rewrites the PR in place instead of piling up new ones.
  #
  # This is the only job that can write to the repository, so it is the one
  # that must not run anything it did not get from this repository's own
  # checkout. It does not set up Go, does not fetch a module and does not
  # start a container. The SDK change arrives as two files a read-only leg
  # produced and tested; this job copies them in and checks them as data.
  # The token is not in the job's environment and is not left in the checkout
  # (persist-credentials: false): only the three steps that call `gh` or
  # `git push` are handed it, and those steps run nothing else.
  #
  # Whether a PR can be opened at all depends on the repository (see the top
  # of this file). When GitHub refuses, the branch that was just pushed is
  # deleted again, so no PR-less branch is left behind, and the step fails
  # with the two ways to fix it.
  bump:
    name: ${{ matrix.axis }} axis PR
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the PR branch
      pull-requests: write   # open, rewrite or close the PR
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: gateway
            branch: compat-sweep/gateway
          - axis: sdk
            branch: compat-sweep/sdk
    env:
      AXIS: ${{ matrix.axis }}
      BRANCH: ${{ matrix.branch }}
      # open | close | skip, decided by the report for this axis alone.
      ACTION: ${{ matrix.axis == 'gateway' && needs.report.outputs.gateway_pr || needs.report.outputs.sdk_pr }}
      GH_REPO: ${{ github.repository }}
      # 'true' or 'false', never the secret: the PR body says whether CI will
      # start by itself.
      HAS_SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN != '' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sweep-decision
          path: /tmp/sweep
      # One directory per passing leg of the release SDK, each holding the
      # go.mod and go.sum that leg tested.
      - uses: actions/download-artifact@v4
        if: env.ACTION == 'open' && env.AXIS == 'sdk'
        with:
          pattern: sweep-sdk-gomod-sdk-release-*
          path: /tmp/sweep/tested

      # `--head` matches the branch NAME, in this repository and in every
      # fork, so what comes back is only a list of candidates. Which of them
      # is the sweep's own is decided by prs.py from isCrossRepository.
      - name: List open pull requests on this axis's branch
        if: env.ACTION != 'skip'
        env:
          GH_TOKEN: ${{ secrets.SWEEP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh pr list --head "$BRANCH" --state open --limit 100 \
            --json number,title,headRefName,isCrossRepository > /tmp/sweep/prs.json

      # No token here. The edit, the guard and the commit need none.
      - name: Apply the change for this axis and nothing else
        if: env.ACTION == 'open'
        run: |
          set -euo pipefail
          if [ "$AXIS" = "gateway" ]; then
            $SWEEP bump-gateway --decision /tmp/sweep/decision.json
          else
            $SWEEP bump-sdk --decision /tmp/sweep/decision.json --tested /tmp/sweep/tested
          fi
          # README.md restates the range and the SDK pin in a generated block,
          # and CI fails when that block is stale. The script is this
          # repository's own and needs only Node. Where it does not exist yet
          # there is no block, and this is a no-op.
          if [ -f scripts/readme-gateway-range.mjs ]; then
            node scripts/readme-gateway-range.mjs --write
          fi
          # Refuses anything outside this axis before a commit exists.
          $SWEEP check-diff --axis "$AXIS" --changed-out /tmp/sweep/changed.txt
          $SWEEP pr-text --axis "$AXIS" --decision /tmp/sweep/decision.json \
            --changed /tmp/sweep/changed.txt --prs /tmp/sweep/prs.json --branch "$BRANCH" \
            --run-url "$RUN_URL" --repo-url "$REPO_URL" --has-sweep-token "$HAS_SWEEP_TOKEN" \
            --out /tmp/sweep/pr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          # -s: this repository requires a DCO sign-off on every commit.
          git commit -s -F /tmp/sweep/pr/commit.txt

      - name: Push the branch and open or rewrite the PR
        if: env.ACTION == 'open'
        env:
          GH_TOKEN: ${{ secrets.SWEEP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # The checkout kept no credentials, so the token is handed to git for
          # this one command, from the environment: it is never written to the
          # git config and never appears on a command line.
          push() {
            git -c credential.helper= \
              -c 'credential.helper=!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' \
              push "$@"
          }
          push --force origin "HEAD:refs/heads/$BRANCH"
          title=$(cat /tmp/sweep/pr/title.txt)
          num=$(cat /tmp/sweep/pr/number.txt)
          if [ -n "$num" ]; then
            gh api --method PATCH "repos/$GH_REPO/pulls/$num" --silent \
              -f title="$title" -F body=@/tmp/sweep/pr/body.md
            echo "rewrote PR #$num"
            echo "**$AXIS axis:** rewrote pull request #$num ($title)." >> "$GITHUB_STEP_SUMMARY"
          elif url=$(gh pr create --head "$BRANCH" --base main --title "$title" --body-file /tmp/sweep/pr/body.md 2>/tmp/sweep/pr/create.err); then
            echo "opened $url"
            echo "**$AXIS axis:** opened $url ($title)." >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/sweep/pr/create.err >&2
            # No pull request, so the branch just pushed would be an orphan
            # that looks like a pending change. Take it away again.
            push origin --delete "$BRANCH" || echo "::warning::could not delete $BRANCH; delete it by hand"
            echo "**$AXIS axis: NO pull request was opened.** GitHub refused to create it (see the \`$AXIS axis PR\` job). The branch was deleted again. There is nothing to merge until the repository setting or the SWEEP_TOKEN secret named in that job's error is in place." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=The sweep could not open its pull request::GitHub refused to create the pull request for $BRANCH (its answer is above). With the default token that is what happens while the repository setting 'Allow GitHub Actions to create and approve pull requests' is off. Do ONE of these, then re-run the sweep: (1) enable that setting under Settings > Actions > General > Workflow permissions; or (2) add a repository secret SWEEP_TOKEN, a fine-grained or GitHub App token with Contents and Pull requests read/write on this repository. The branch was deleted again, so nothing is left behind."
            exit 1
          fi

      # The evidence for an open PR is the sweep that opened it. A run closes
      # it only when it retested that same change and no longer proposes it.
      # prs.py decides; a PR for a release this run did not retest is left open.
      - name: Decide what happens to a PR this run does not propose
        if: env.ACTION == 'close'
        run: |
          set -euo pipefail
          $SWEEP pr-close --axis "$AXIS" --decision /tmp/sweep/decision.json \
            --prs /tmp/sweep/prs.json --branch "$BRANCH" --run-url "$RUN_URL" --out /tmp/sweep/close
          # Empty unless the PR is left open; then it says which and why.
          cat /tmp/sweep/close/note.md >> "$GITHUB_STEP_SUMMARY"

      - name: Close it
        if: env.ACTION == 'close'
        env:
          GH_TOKEN: ${{ secrets.SWEEP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          num=$(cat /tmp/sweep/close/number.txt)
          if [ -n "$num" ]; then
            gh pr close "$num" --comment "$(cat /tmp/sweep/close/comment.md)"
            echo "**$AXIS axis:** closed pull request #$num." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nothing to close on $BRANCH"
          fi

  # Makes "the sweep could not finish" a red run even when every job that ran
  # reported success, for example when result artifacts could not be read.
  verdict:
    name: Sweep completed
    needs: [report, bump]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      REPORT: ${{ needs.report.result }}
      INCOMPLETE: ${{ needs.report.outputs.incomplete }}
    steps:
      - name: Fail when the report is missing or incomplete
        run: |
          set -euo pipefail
          if [ "$REPORT" != "success" ]; then
            echo "::error::The report job did not succeed ($REPORT); nothing was concluded."
            exit 1
          fi
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error::At least one leg did not report, or legs disagreed. Those rows are unknown; nothing that depends on them was proposed or closed (see the summary)."
            exit 1
          fi
