# Forward compatibility sweep (ADR 0005).
#
# The `compat` job in ci.yml answers "do we still honor the range we promised?"
# This answers the other half: "how far ahead can we move?"
#
# Because sdk/go is a submodule of NVIDIA/OpenShell, a gateway release tag
# resolves to an exact matching SDK commit, so this walks ONE axis — release
# tags — taking both halves from the same tag. There is no SDK x gateway
# cross-product.
#
# Advisory by construction: it reports, it never gates. A green row newer than
# the current floor is the signal to open a range-bump PR.
name: Compat sweep

on:
  schedule:
    # Mondays 06:00 UTC — upstream cadence is roughly weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Only sweep releases strictly newer than this tag"
        required: false
        default: "0.0.116"
      max_versions:
        description: "Cap on how many releases to sweep (newest first)"
        required: false
        default: "5"

permissions:
  contents: read
  # The sweep maintains a single tracking issue. A weekly cron whose output
  # only lands in the Actions tab does not get read.
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Pick candidate releases
        id: pick
        env:
          SINCE: ${{ inputs.since || '0.0.116' }}
          MAXV: ${{ inputs.max_versions || '5' }}
        run: |
          set -euo pipefail
          # Upstream release tags that also have a published gateway image.
          git ls-remote --tags --refs https://github.com/NVIDIA/OpenShell.git \
            | awk '{print $1" "$2}' | sed 's|refs/tags/||' > /tmp/tags.txt
          python3 - <<'PY' > /tmp/versions.json
          import os, re, json, urllib.request

          since = tuple(int(x) for x in os.environ["SINCE"].lstrip("v").split("."))
          maxv  = int(os.environ["MAXV"])

          rows = []
          for line in open("/tmp/tags.txt"):
              sha, tag = line.split()
              m = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)', tag)
              if m:
                  rows.append((tuple(int(g) for g in m.groups()), tag.lstrip("v"), sha))
          rows.sort(reverse=True)

          # Only tags with a real gateway image are worth a runner.
          tok = json.load(urllib.request.urlopen(
              "https://ghcr.io/token?scope=repository:nvidia/openshell/gateway:pull&service=ghcr.io"))["token"]
          def published(tag):
              req = urllib.request.Request(
                  f"https://ghcr.io/v2/nvidia/openshell/gateway/manifests/{tag}",
                  headers={"Authorization": "Bearer " + tok,
                           "Accept": "application/vnd.oci.image.index.v1+json,"
                                     "application/vnd.docker.distribution.manifest.list.v2+json"})
              try:
                  urllib.request.urlopen(req); return True
              except Exception:
                  return False

          out = []
          for ver, tag, sha in rows:
              if ver <= since:
                  break
              if published(tag):
                  out.append({"version": tag, "sha": sha})
              if len(out) >= maxv:
                  break
          print(json.dumps(out))
          PY
          echo "versions=$(cat /tmp/versions.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys;print(len(json.load(open("/tmp/versions.json"))))')" >> "$GITHUB_OUTPUT"
          echo "Candidates:"; cat /tmp/versions.json

  sweep:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.versions) }}
    env:
      COMPAT_SANDBOX_IMAGE: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Move the SDK to this release's commit
        run: |
          set -euo pipefail
          cd backend
          # Both halves come from one tree: take the SDK at the same commit the
          # gateway image was built from.
          go get "github.com/NVIDIA/OpenShell/sdk/go@${{ matrix.target.sha }}"
          echo "SDK now: $(go list -m github.com/NVIDIA/OpenShell/sdk/go)"

      - name: Build BFF
        id: build
        run: cd backend && go build -o ../bin/server ./cmd/server

      - name: Pull images
        run: |
          set -euo pipefail
          docker pull "ghcr.io/nvidia/openshell/gateway:${{ matrix.target.version }}"
          docker pull "ghcr.io/nvidia/openshell/supervisor:${{ matrix.target.version }}"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      - name: Start gateway stack
        env:
          OPENSHELL_VERSION: ${{ matrix.target.version }}
          # A sweep crosses the v1/v2 config boundary and cannot know in
          # advance which side a release sits on.
          OPENSHELL_CONFIG_SCHEMA: auto
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start BFF
        run: |
          set -euo pipefail
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      - name: Run compat suite
        id: compat
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -timeout 20m ./test/compat/...

      # Matrix job outputs overwrite each other in GitHub Actions, so each leg
      # records its own result as an artifact for the report job to collect.
      # outcome is skipped when the stack never came up, which is a result too.
      - name: Record result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/sweep
          printf '{"version":"%s","sdk":"%s","outcome":"%s"}\n' \
            '${{ matrix.target.version }}' \
            '${{ matrix.target.sha }}' \
            '${{ steps.compat.outcome }}' > '/tmp/sweep/${{ matrix.target.version }}.json'
          cat '/tmp/sweep/${{ matrix.target.version }}.json'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-result-${{ matrix.target.version }}
          path: /tmp/sweep/*.json
          retention-days: 7

      - name: Gateway logs on failure
        if: failure()
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=150

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  report:
    needs: [discover, sweep]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-result-*
          path: /tmp/results
          merge-multiple: true

      - name: Render report
        env:
          FLOOR: ${{ inputs.since || '0.0.116' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os

          rows = [json.load(open(f)) for f in sorted(glob.glob("/tmp/results/*.json"))]
          rows.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")), reverse=True)
          passing = [r for r in rows if r["outcome"] == "success"]
          label = {"success": "pass", "failure": "fail", "skipped": "stack did not start"}

          out = ["<!-- compat-sweep-singleton -->",
                 "Maintained by `.github/workflows/compat-sweep.yml` (ADR 0005).",
                 "This issue is a singleton: it is rewritten on each run while open.",
                 "**Close it once the bump has landed** — the next sweep with a new",
                 "result will open a fresh one.", ""]

          if passing:
              best = passing[0]
              out += [f"### A newer gateway passes: `{best['version']}`", "",
                      "The supported range can move. Per ADR 0005 the SDK pin, the gateway",
                      "pins and the declared range move together in **one** PR:", "",
                      "```bash",
                      f"cd backend && go get github.com/NVIDIA/OpenShell/sdk/go@{best['sdk']}",
                      "```", "",
                      "Then update the `compat` matrix in `.github/workflows/ci.yml`:",
                      f"gateway `{best['version']}`, and the config schema its build expects.", ""]
          else:
              out += [f"### Nothing newer than the floor (`{os.environ['FLOOR']}`) passes",
                      "", "The declared range stays where it is. No action needed.", ""]

          out += ["| Gateway | Result | SDK commit |", "|---|---|---|"]
          for r in rows:
              out.append(f"| `{r['version']}` | {label.get(r['outcome'], r['outcome'])} | `{r['sdk'][:12]}` |")
          out += ["", f"[Sweep run]({os.environ['RUN_URL']})"]

          open("/tmp/body.md", "w").write("\n".join(out) + "\n")

          title = (f"Gateway compatibility: {passing[0]['version']} passes — SDK bump available"
                   if passing else "Gateway compatibility: no newer release passes")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"SWEEP_TITLE={title}\n")
              fh.write(f"SWEEP_ACTIONABLE={'1' if passing else '0'}\n")
          PY
          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the singleton issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keyed by label rather than title, so a human retitling the issue
          # does not cause the next run to open a duplicate. Scoped to OPEN
          # issues: closing one means "handled", and the next run with a
          # result opens a fresh one.
          gh label create compat-sweep --color 1d76db \
            --description "Automated gateway compatibility sweep" --force >/dev/null 2>&1 || true

          num=$(gh issue list --label compat-sweep --state open \
                  --json number --jq '.[0].number // empty')

          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$SWEEP_TITLE" --body-file /tmp/body.md
            echo "updated singleton issue #$num"
          elif [ "$SWEEP_ACTIONABLE" = "1" ]; then
            gh issue create --label compat-sweep --title "$SWEEP_TITLE" --body-file /tmp/body.md
            echo "opened a new singleton issue"
          else
            # Nothing actionable and nothing open — do not create noise.
            echo "no newer release passes and no open sweep issue; nothing posted"
          fi

  none:
    needs: discover
    if: needs.discover.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No published gateway release newer than the sweep floor." >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing to sweep — the declared range is already at the newest release." >> "$GITHUB_STEP_SUMMARY"
