# Gateway compatibility sweep (ADR 0006, which amends ADR 0005).
#
# ci.yml's `compat` job answers "do we still work with the range we claim?" on
# every PR. This workflow looks further, on a schedule, along TWO INDEPENDENT
# AXES. Each axis holds the other side still, so a result always says which
# link of gateway -> SDK -> BFF it is about:
#
#   gateway axis  SDK held at the pin in backend/go.mod; the gateway image
#                 varies. "Which gateways does the code we ship today work
#                 with?" A failure is on the WIRE link (gateway<->SDK).
#                 PR: deploy/ci/gateway-pins.json only (the ceiling lane).
#
#   sdk axis      Gateways held at the required lanes; the SDK varies. "Can we
#                 move to a newer SDK without losing a gateway we support?"
#                 Build/vet/unit tests prove the SOURCE link (SDK<->BFF) first,
#                 then the compat suite proves the wire link on every lane.
#                 PR: backend/go.mod, backend/go.sum and the `sdk` field only.
#
# The previous version moved the SDK and the gateway together and reported the
# outcome as gateway compatibility. One SDK compile error then read as "3
# releases need migration" (#75) for three gateways that worked.
#
# Invariants. Each is enforced in code, not only stated here:
#   1. An automated PR changes exactly one axis.     sweep.py check-diff (guard.py)
#   2. dev / HEAD and @latest are never pinned.      outcomes.py, pins.py
#   3. Every compat run uses -count=1.               tests/test_workflows.py
#   4. Release lanes are pinned by digest.           pins.py validate
#   5. No ${{ }} inside a run: script; values        tests/test_workflows.py
#      reach scripts through env:.
#   6. Least-privilege permissions per job.          tests/test_workflows.py
#
# All decision logic lives in deploy/ci/sweep/ with unit tests. This file only
# checks out, sets up toolchains, starts containers and calls `gh`.
#
# A red run means the sweep itself broke. Findings never turn it red: they go
# to one issue (rewritten in place, closed when nothing is outstanding) and to
# at most one PR per axis. Nothing is ever merged automatically.
name: Compat sweep

on:
  schedule:
    # Mondays 06:00 UTC. Upstream releases roughly weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      max_versions:
        description: "Gateway axis: how many releases to sweep, newest first"
        required: false
        default: "5"
      include_head:
        description: "Also probe upstream HEAD (gateway dev, sdk@latest) as early warning"
        type: choice
        options: ["1", "0"]
        default: "1"
      since:
        description: "Gateway axis: also sweep back to this release, below the floor (informational, e.g. 0.0.116)"
        required: false
        default: ""

# Nothing by default. Every job asks for exactly what it uses.
permissions: {}

# The issue and the two PR branches are singletons; two sweeps at once would
# fight over them.
concurrency:
  group: compat-sweep
  cancel-in-progress: false

env:
  SWEEP: python3 deploy/ci/sweep/sweep.py

jobs:
  plan:
    name: Plan both axes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gateway_matrix: ${{ steps.plan.outputs.gateway_matrix }}
      gateway_count: ${{ steps.plan.outputs.gateway_count }}
      sdk_matrix: ${{ steps.plan.outputs.sdk_matrix }}
      sdk_count: ${{ steps.plan.outputs.sdk_count }}
    steps:
      - uses: actions/checkout@v4

      # Go turns an SDK query (a release tag's commit, @latest) into the exact
      # version it would write to go.mod. Resolved once here, so every leg
      # tests the same SDK even if upstream HEAD moves during the run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Unit-test the sweep logic
        run: python3 -m unittest discover -s deploy/ci/sweep

      - name: Discover candidates
        id: plan
        env:
          MAX_VERSIONS: ${{ inputs.max_versions || '5' }}
          INCLUDE_HEAD: ${{ inputs.include_head || '1' }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          $SWEEP plan --max-versions "$MAX_VERSIONS" --include-head "$INCLUDE_HEAD" \
            --since "$SINCE" --out /tmp/sweep/plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-plan
          path: /tmp/sweep/plan.json
          retention-days: 7

  # Gateway axis, part 1: the code we ship, built ONCE from the checked-in
  # go.mod. Every gateway leg runs this same binary, so the only thing that
  # differs between legs is the gateway.
  bff:
    name: Build the BFF we ship
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # backend/go.mod is never modified on the gateway axis. With
      # -mod=readonly Go refuses to, and the diff below proves it did not.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build from the checked-in go.mod
        run: |
          set -euo pipefail
          (cd backend && go build -o ../bin/server ./cmd/server)
          git diff --exit-code -- backend/go.mod backend/go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-bff
          path: bin/server
          if-no-files-found: error
          retention-days: 1

  # Gateway axis, part 2: one leg per candidate gateway. The images are the
  # tag@digest references the plan resolved, so a later PR pins exactly what
  # was tested here.
  gateway:
    name: gateway ${{ matrix.version }} x the SDK we pin
    needs: [plan, bff]
    if: needs.plan.outputs.gateway_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gateway_matrix) }}
    env:
      LEG: ${{ toJSON(matrix) }}
      OPENSHELL_GATEWAY_IMAGE: ${{ matrix.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ matrix.supervisor_image }}
      # A sweep crosses config-schema boundaries and cannot know in advance
      # which side a release sits on. The stack reports what the gateway took.
      OPENSHELL_CONFIG_SCHEMA: auto
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      # For `go test` only: the BFF under test is the downloaded binary.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: sweep-bff
          path: bin

      - name: Pull images
        run: |
          set -euo pipefail
          # Same digest-pinned workload image as the PR lanes: this axis varies
          # the gateway, not the workload.
          COMPAT_SANDBOX_IMAGE=$(jq -er '.sandbox_image' deploy/ci/gateway-pins.json)
          echo "COMPAT_SANDBOX_IMAGE=$COMPAT_SANDBOX_IMAGE" >> "$GITHUB_ENV"
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # From here on a failing step is a RESULT, not an error, so it must not
      # fail the leg. A gateway that never starts is recorded as stack_failed:
      # no request reached it, so it says nothing about either link.
      - name: Start gateway stack
        id: stack
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        if: steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          chmod +x bin/server
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: the suite talks to a live gateway, which Go's test cache
      # cannot see. A cached pass must never stand in for this gateway.
      - name: Run compat suite
        id: compat
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -timeout 20m ./test/compat/...

      # Runs only when every step above that is NOT allowed to fail succeeded.
      # A leg that broke for its own reasons uploads nothing, and the report
      # reads a missing result as unknown - never as a pass or a failure.
      - name: Record result
        env:
          STACK: ${{ steps.stack.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
          CONFIG_SCHEMA: ${{ steps.stack.outputs.config_schema }}
        run: |
          set -euo pipefail
          $SWEEP record-gateway --leg "$LEG" --stack "$STACK" --compat "$COMPAT" \
            --config-schema "$CONFIG_SCHEMA" --out /tmp/sweep/results

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-result-${{ matrix.id }}
          path: /tmp/sweep/results/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Gateway logs
        if: always() && (steps.stack.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # SDK axis: one leg per candidate SDK x required lane. The gateway images are
  # the lanes exactly as pinned; they are never modified on this axis.
  sdk:
    name: sdk ${{ matrix.sdk_label }} x gateway ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.sdk_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.sdk_matrix) }}
    env:
      LEG: ${{ toJSON(matrix) }}
      SDK_VERSION: ${{ matrix.sdk_version }}
      OPENSHELL_GATEWAY_IMAGE: ${{ matrix.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ matrix.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ matrix.config_schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The SOURCE link, before any gateway is involved: go get, go mod tidy,
      # go build, go vet, go test. When this fails the outcome is
      # source_incompatible and the compiler's output goes into the report as
      # a source migration - explicitly not as a gateway problem.
      - name: Source link (move the SDK; build, vet and unit-test the BFF)
        id: source
        continue-on-error: true
        run: |
          set -euo pipefail
          $SWEEP sdk-source-check --sdk-version "$SDK_VERSION" --log /tmp/sweep/source.log

      - name: Build the BFF against this SDK
        if: steps.source.outcome == 'success'
        run: cd backend && go build -o ../bin/server ./cmd/server

      - name: Pull images
        if: steps.source.outcome == 'success'
        run: |
          set -euo pipefail
          COMPAT_SANDBOX_IMAGE=$(jq -er '.sandbox_image' deploy/ci/gateway-pins.json)
          echo "COMPAT_SANDBOX_IMAGE=$COMPAT_SANDBOX_IMAGE" >> "$GITHUB_ENV"
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # The WIRE link: the BFF built against the candidate SDK, run against a
      # gateway we already support.
      - name: Start gateway stack
        id: stack
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        if: steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: see the gateway axis. Four legs share a restored GOCACHE.
      - name: Run compat suite
        id: compat
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -timeout 20m ./test/compat/...

      - name: Record result
        env:
          SOURCE: ${{ steps.source.outcome }}
          SOURCE_STEP: ${{ steps.source.outputs.step }}
          STACK: ${{ steps.stack.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
        run: |
          set -euo pipefail
          $SWEEP record-sdk --leg "$LEG" --source "$SOURCE" --source-step "$SOURCE_STEP" \
            --source-log /tmp/sweep/source.log --stack "$STACK" --compat "$COMPAT" \
            --out /tmp/sweep/results

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-result-${{ matrix.id }}
          path: /tmp/sweep/results/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Gateway logs
        if: always() && (steps.stack.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # Classifies what came back and maintains the one issue. Runs even when legs
  # failed or nothing was swept: an open issue must not go stale, and a run
  # with nothing outstanding must leave nothing open.
  report:
    name: Report
    needs: [plan, gateway, sdk]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      gateway_pr: ${{ steps.report.outputs.gateway_pr }}
      sdk_pr: ${{ steps.report.outputs.sdk_pr }}
      incomplete: ${{ steps.report.outputs.incomplete }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sweep-plan
          path: /tmp/sweep
      - uses: actions/download-artifact@v4
        # No result at all is a state the report handles (every row "no result").
        continue-on-error: true
        with:
          pattern: sweep-result-*
          path: /tmp/sweep/results
          merge-multiple: true

      - name: Classify and render
        id: report
        run: |
          set -euo pipefail
          mkdir -p /tmp/sweep/results
          $SWEEP report --plan /tmp/sweep/plan.json --results /tmp/sweep/results \
            --run-url "$RUN_URL" --out /tmp/sweep/report
          cat /tmp/sweep/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-decision
          path: /tmp/sweep/report/decision.json
          if-no-files-found: error
          retention-days: 7

      # main only: a manual run from another branch is a dry run. It reports to
      # the step summary and changes nothing.
      - name: Maintain the issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.report.outputs.issue_action }}
        run: |
          set -euo pipefail
          # Found by label, not by title: the title changes with the findings.
          # Only OPEN issues count, so closing one means "handled".
          gh label create compat-migrate --color b60205 --force \
            --description "Compat sweep: a gateway<->SDK or SDK<->BFF link needs a person" >/dev/null 2>&1 || true
          num=$(gh issue list --label compat-migrate --state open --json number --jq '.[0].number // empty')
          case "$ACTION" in
            upsert)
              title=$(cat /tmp/sweep/report/issue-title.txt)
              if [ -n "$num" ]; then
                gh api --method PATCH "repos/$GH_REPO/issues/$num" --silent \
                  -f title="$title" -F body=@/tmp/sweep/report/issue-body.md
                echo "rewrote issue #$num"
              else
                gh issue create --label compat-migrate --title "$title" \
                  --body-file /tmp/sweep/report/issue-body.md
              fi
              ;;
            close)
              if [ -n "$num" ]; then
                gh issue close "$num" --comment "Nothing is outstanding on either axis in $RUN_URL. Closing; the next sweep that finds something opens a fresh issue."
              else
                echo "nothing outstanding and no issue open"
              fi
              ;;
            *)
              echo "::warning::The sweep is incomplete, so the issue was left exactly as it is."
              ;;
          esac

  # At most one PR per axis, each on a fixed branch that is force-pushed, so a
  # later sweep rewrites the PR in place instead of piling up new ones.
  #
  # Known limitation: a PR opened with the default GITHUB_TOKEN does not get CI
  # by itself (GitHub holds or skips workflow runs triggered by that token).
  # Set the optional repository secret SWEEP_TOKEN (a fine-grained or GitHub
  # App token with Contents and Pull requests read/write) to make CI run on
  # its own; without it the PR body says how to start CI by hand.
  bump:
    name: ${{ matrix.axis }} axis PR
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the PR branch
      pull-requests: write   # open, rewrite or close the PR
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: gateway
            branch: compat-sweep/gateway
          - axis: sdk
            branch: compat-sweep/sdk
    env:
      AXIS: ${{ matrix.axis }}
      BRANCH: ${{ matrix.branch }}
      # open | close | skip, decided by the report for this axis alone.
      ACTION: ${{ matrix.axis == 'gateway' && needs.report.outputs.gateway_pr || needs.report.outputs.sdk_pr }}
      GH_TOKEN: ${{ secrets.SWEEP_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SWEEP_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: sweep-decision
          path: /tmp/sweep
      - uses: actions/setup-go@v5
        if: env.ACTION == 'open' && env.AXIS == 'sdk'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The SDK change is produced by the same command the legs ran, so the
      # tree committed here is the tree that was tested. check-diff then
      # refuses anything outside this axis before a commit exists.
      - name: Apply the change for this axis and nothing else
        if: env.ACTION == 'open'
        run: |
          set -euo pipefail
          if [ "$AXIS" = "gateway" ]; then
            $SWEEP bump-gateway --decision /tmp/sweep/decision.json
          else
            sdk=$(jq -er '.sdk.bump.version' /tmp/sweep/decision.json)
            $SWEEP sdk-source-check --sdk-version "$sdk" --log /tmp/sweep/source.log
            $SWEEP bump-sdk --decision /tmp/sweep/decision.json
          fi
          $SWEEP check-diff --axis "$AXIS"
          $SWEEP pr-text --axis "$AXIS" --decision /tmp/sweep/decision.json \
            --run-url "$RUN_URL" --has-sweep-token "$HAS_SWEEP_TOKEN" --out /tmp/sweep/pr

      - name: Push the branch and open or rewrite the PR
        if: env.ACTION == 'open'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          # -s: this repository requires a DCO sign-off on every commit.
          git commit -s -F /tmp/sweep/pr/commit.txt
          git push --force origin "$BRANCH"
          title=$(cat /tmp/sweep/pr/title.txt)
          num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh api --method PATCH "repos/$GH_REPO/pulls/$num" --silent \
              -f title="$title" -F body=@/tmp/sweep/pr/body.md
            echo "rewrote PR #$num"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file /tmp/sweep/pr/body.md
          fi

      # The evidence for an open PR is the last sweep. When this run could not
      # reproduce it, the PR is closed rather than left looking mergeable.
      - name: Close a PR this run no longer stands behind
        if: env.ACTION == 'close'
        run: |
          set -euo pipefail
          num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh pr close "$num" --comment "The sweep in $RUN_URL no longer supports this change (see its summary). Closing; a later sweep reopens the branch if the result returns."
          else
            echo "no open PR on $BRANCH"
          fi

  # Makes "the sweep could not finish" a red run even when every job that ran
  # reported success, for example when result artifacts could not be read.
  verdict:
    name: Sweep completed
    needs: [report, bump]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      REPORT: ${{ needs.report.result }}
      INCOMPLETE: ${{ needs.report.outputs.incomplete }}
    steps:
      - name: Fail when the report is missing or incomplete
        run: |
          set -euo pipefail
          if [ "$REPORT" != "success" ]; then
            echo "::error::The report job did not succeed ($REPORT); nothing was concluded."
            exit 1
          fi
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error::At least one leg did not report. Its rows are unknown; the issue and that axis's PR were left alone."
            exit 1
          fi
