# Cuts a release of main when a person asks for one.
#
# Releases are cut by hand. Start this workflow on main, choose patch, minor or
# major, and leave "dry run" ticked to see the version and the notes first;
# run it again with "dry run" cleared to publish. Merging a pull request never
# publishes anything by itself, whatever its title says.
#
# The one exception is a pull request the compat sweep opened to raise the
# gateway ceiling or move the SDK. Once it is merged and CI has passed on main,
# this workflow cuts a patch for it without being asked: that release is the
# point of the pull request and the one most likely to be forgotten. Which
# commits qualify is decided from where they came from, not from their title;
# see scripts/release/sweep-bump.mjs.
#
# One version, three artifacts, each of which says which OpenShell gateways it
# supports (#66, ADR 0005):
#
#   npm package      semantic-release publishes it; `openshell` in package.json
#   GitHub release   semantic-release creates it; a section in the notes
#   container image  the image CI already built for this commit gets the tags
#                    X.Y.Z and X.Y; it carries the range as env vars and labels
#
# What a release contains and declares is in release.config.cjs.
# docs/releasing.md walks through the whole pipeline.
#
# This file must stay named publish.yml: npm trusted publishing is bound to the
# workflow filename, and a renamed workflow can no longer publish.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "What kind of release to cut from main"
        type: choice
        required: true
        # The first option is not a release type on purpose. GitHub preselects
        # the first option, and a release nobody chose is what this is here to
        # prevent; the run fails until one of the other three is picked.
        options:
          - "(choose one)"
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run: show the version and the notes, publish nothing"
        type: boolean
        default: true
  # Only for merged compat-sweep bumps; every other CI run that finishes on
  # main ends this workflow without releasing.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two ways in, and both must mean "main":
    #
    #   workflow_dispatch  a maintainer asked for a release, on main.
    #   workflow_run       CI passed for a PUSH to main in THIS repository.
    #                      Releases only if that push is a merged sweep bump.
    #
    # The event and repository checks are not redundant. `branches: [main]`
    # above matches the head branch NAME of the run that finished, so a pull
    # request opened from a fork's own `main` branch also arrives here with
    # head_branch == 'main'. Without them this job — which can write to the
    # repository and publish to npm — would check out and build that fork's
    # code.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      # To ask whether CI passed for the commit a person wants to release.
      actions: read
    outputs:
      version: ${{ steps.released.outputs.version }}
      image_tags: ${{ steps.released.outputs.image_tags }}
      source_tag: ${{ steps.released.outputs.source_tag }}
      sha: ${{ steps.released.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # For workflow_run, publish exactly the commit whose CI completed.
          # For manual runs, publish the selected main branch commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Full history and every tag: semantic-release works out the next
          # version from them, and the step after it reads them too.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Decides what this run releases, if anything, before anything is built.
      #
      #   asked for by a person   the type they chose; a dry run unless they
      #                           cleared the box. A real release also needs CI
      #                           to have passed for this commit: the image the
      #                           release tags is the one that CI run built.
      #   CI finished on main     a patch, but only when the commit is a merged
      #                           compat-sweep bump that stayed on its axis.
      #                           Anything else: nothing, and the job ends green.
      - name: What does this run release?
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          type=""
          dry_run="false"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$CHOSEN" in
              patch|minor|major) type="$CHOSEN" ;;
              *)
                echo "::error::Choose the kind of release to cut: patch, minor or major."
                exit 1
                ;;
            esac
            dry_run="$DRY_RUN"
            green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success&per_page=1" --jq '.total_count')"
            if [ "$green" -lt 1 ]; then
              if [ "$dry_run" = "true" ]; then
                echo "::warning::CI has not passed for $sha on main. This dry run goes ahead; a real release of this commit would be refused."
              else
                echo "::error::CI has not passed for $sha on main, so there is no tested image to release. Wait for CI, or fix it, then run this again."
                exit 1
              fi
            fi
            echo "Asked for by a person: a $type release$([ "$dry_run" = "true" ] && echo ' (dry run)')." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            axis="$(node scripts/release/sweep-bump.mjs --sha "$sha" --repo "$REPO" | sed -n 's/^axis=//p')"
            if [ -n "$axis" ]; then
              type="patch"
              echo "Merged compat-sweep bump on the $axis axis: cutting a patch." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "CI passed for $sha, which is not a compat-sweep bump. Nothing is released automatically; releases are cut by hand (docs/releasing.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "type=$type"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      # npm trusted publishing requires npm >= 11.5.1. It exchanges the
      # job's GitHub OIDC token for a short-lived npm publish credential.
      - name: Configure npm trusted publishing
        if: steps.plan.outputs.type != ''
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        if: steps.plan.outputs.type != ''
        run: cd frontend && npm ci

      - name: Build library
        if: steps.plan.outputs.type != ''
        run: cd frontend && npm run build:lib

      - name: Verify packed package imports in Node ESM
        if: steps.plan.outputs.type != ''
        run: cd frontend && npm run verify:consumer

      # Tags vX.Y.Z, publishes the npm package and creates the GitHub release,
      # for the kind of release decided above (RELEASE_TYPE; the release
      # configuration refuses to run without it). With --dry-run it prints the
      # version and the notes and changes nothing. If there are no commits
      # since the last release, or main has moved on since this commit, it
      # does nothing and still succeeds.
      #
      # The version is pinned here and only here; ci.yml's release-tooling job
      # reads it from this line to test release.config.cjs against the same one.
      - name: Publish
        if: steps.plan.outputs.type != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ steps.plan.outputs.type }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npx semantic-release@25.0.9 "${args[@]}"

      # "Was a release cut" is answered by the repository, not by parsing what
      # semantic-release printed: is there a vX.Y.Z tag on the commit we checked
      # out? That holds for both triggers, it is empty when nothing was
      # released (a dry run, or a commit nobody asked to release), and it is
      # still true on a re-run after a release whose image tagging failed. See
      # scripts/release/released-version.mjs.
      - name: Was a release cut at this commit?
        id: released
        run: |
          # pipefail, or a failing script would hide behind tee's exit 0.
          set -euo pipefail
          node scripts/release/released-version.mjs | tee -a "$GITHUB_OUTPUT"

  # Gives the release its container image tags.
  #
  # CI built the image for this commit and pushed it as sha-<commit> before any
  # of this started; nothing is built here. The job resolves that tag to its
  # digest and points X.Y.Z (and X.Y, when this is the newest patch of it) at the
  # same digest, so the versioned image is the one CI built for the released
  # commit, not a rebuild.
  #
  # X.Y.Z is written once. If CI was re-run in full for a commit that is already
  # released, sha-<commit> names a new build by now, and retag-image.sh fails
  # here rather than move the release onto it. See docs/releasing.md.
  #
  # A separate job so that the registry credentials are never in the job that
  # holds the npm and repository permissions, and so that a registry hiccup can
  # be retried on its own ("Re-run failed jobs") without touching the release.
  tag-image:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Tag the image built for this commit with the release version
        env:
          SOURCE_TAG: ${{ needs.publish.outputs.source_tag }}
          IMAGE_TAGS: ${{ needs.publish.outputs.image_tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "$IMAGE_TAGS"
          scripts/retag-image.sh quay.io/gkrumbach07/openshell-dashboard "$SOURCE_TAG" "${tags[@]}"

  # Packaged from this commit with the image tag that tag-image just published.
  # Never re-push a stable OCI version; an existing version is left unchanged.
  publish-chart:
    needs: [publish, tag-image]
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Publish immutable versioned chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry="oci://ghcr.io/${GITHUB_REPOSITORY,,}/helm-chart"
          ref="$registry/openshell-dashboard"
          if helm show chart "$ref" --version "$VERSION" > "$RUNNER_TEMP/chart-lookup.log" 2>&1; then
            echo "Chart $ref:$VERSION already exists; leaving immutable version untouched."
            exit 0
          fi
          if ! grep -Eqi 'not found|manifest unknown|404' "$RUNNER_TEMP/chart-lookup.log"; then
            cat "$RUNNER_TEMP/chart-lookup.log"
            exit 1
          fi
          helm package deploy/helm/openshell-dashboard --version "$VERSION" \
            --app-version "$VERSION" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/openshell-dashboard-${VERSION}.tgz" "$registry"
