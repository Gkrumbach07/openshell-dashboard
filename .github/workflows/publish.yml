# Cuts a release when a person asks for one.
#
# A release is started by hand: run this workflow on main, or on a
# release/<major>.<minor> branch, and leave "dry run" ticked to see the version
# and the notes first; run it again with "dry run" cleared to publish. Merging
# a pull request never publishes anything by itself, whatever its title says.
#
# The one exception is the move to a new OpenShell release, which reaches main
# as the pull request from the `next` branch (follow-upstream.yml). Once it is
# merged and CI has passed on main, this workflow releases it without being
# asked: that release is the point of the pull request and the one most likely
# to be forgotten. Which commits qualify is decided from where they came from,
# not from their title; see scripts/release/next-merge.mjs.
#
# Nobody chooses the version (ADR 0009). The console shares the gateway's
# minor release line, so a release is <line>.<n>: the line of the OpenShell
# release the branch pins in deploy/ci/gateway-pins.json, then one more than
# the highest patch already tagged on that line, or 0 when the line has no tag.
# The first release after main moves to a new gateway minor is therefore X.Y.0,
# and every other release is the next patch. See scripts/release/next-version.mjs.
#
# One version, three artifacts. Two of them say which OpenShell gateways the
# release supports (#66, ADR 0009):
#
#   GitHub release   scripts/release/cut-release.mjs creates it, and the tag
#                    vX.Y.Z with it; a section in the notes
#   container image  the image CI already built for this commit gets the tags
#                    X.Y.Z and X.Y; it carries the gateway release line as a
#                    label, and the BFF inside has it compiled in
#
# The third is the Helm chart, packaged at the same version. Nothing is
# published to npm: that package is retired (ADR 0008).
#
# docs/releasing.md walks through the whole pipeline.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the version and the notes, publish nothing"
        type: boolean
        default: true
  # Only for a merged pull request from `next`; every other CI run that
  # finishes on main ends this workflow without releasing.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two ways in:
    #
    #   workflow_dispatch  a maintainer asked for a release, on main or on a
    #                      release/<major>.<minor> branch. The exact shape of
    #                      the branch name, and that a release branch pins its
    #                      own line, is checked by cut-release.mjs.
    #   workflow_run       CI passed for a PUSH to main in THIS repository.
    #                      Releases only if that push is the merge of `next`.
    #
    # The event and repository checks are not redundant. `branches: [main]`
    # above matches the head branch NAME of the run that finished, so a pull
    # request opened from a fork's own `main` branch also arrives here with
    # head_branch == 'main'. Without them this job — which can write to the
    # repository — would check out and run that fork's code.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      # To create the release, and the tag with it.
      contents: write
      # To ask whether the commit was merged from `next`.
      pull-requests: read
      # To ask whether CI passed for the commit a person wants to release.
      actions: read
    outputs:
      version: ${{ steps.released.outputs.version }}
      image_tags: ${{ steps.released.outputs.image_tags }}
      source_tag: ${{ steps.released.outputs.source_tag }}
      sha: ${{ steps.released.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # For workflow_run, publish exactly the commit whose CI completed.
          # For manual runs, publish the tip of the branch it was started on.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Full history and every tag: the version is worked out from the
          # tags, the notes from the history, and the step after reads both.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'

      # Decides whether this run releases, before anything else runs. It does
      # not decide which version: nobody does (cut-release.mjs works it out).
      #
      #   asked for by a person   yes; a dry run unless they cleared the box. A
      #                           real release also needs CI to have passed for
      #                           this commit: the image the release tags is
      #                           the one that CI run built. A commit is asked
      #                           about, not a branch: a release branch that was
      #                           just created points at a commit main's CI
      #                           already built and tested.
      #   CI finished on main     only when the commit was merged from the
      #                           `next` branch of this repository. Anything
      #                           else: nothing, and the job ends green.
      - name: Does this run release?
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          release="false"
          dry_run="false"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release="true"
            dry_run="$DRY_RUN"
            green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success&per_page=1" --jq '.total_count')"
            if [ "$green" -lt 1 ]; then
              if [ "$dry_run" = "true" ]; then
                echo "::warning::CI has not passed for $sha. This dry run goes ahead; a real release of this commit would be refused."
              else
                echo "::error::CI has not passed for $sha, so there is no tested image to release. Wait for CI, or fix it, then run this again."
                exit 1
              fi
            fi
            echo "Asked for by a person, on $BRANCH$([ "$dry_run" = "true" ] && echo ' (dry run)')." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            from="$(node scripts/release/next-merge.mjs --sha "$sha" --repo "$REPO" | sed -n 's/^from=//p')"
            if [ -n "$from" ]; then
              release="true"
              echo "Merged from $from, the move to a new OpenShell release: releasing it." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "CI passed for $sha, which was not merged from next. Nothing is released automatically; a release is started by hand (docs/releasing.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "release=$release"
            echo "dry_run=$dry_run"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      # Works out the version and the notes, creates the GitHub release and,
      # with it, the tag vX.Y.Z at this commit. With --dry-run it prints the
      # version, every release tag it was worked out from and the notes, and
      # creates nothing. A commit that already carries a release tag of its
      # line is left alone, so re-running this run after a later job failed
      # does not cut a second release. (Re-running THIS run: a new run is for
      # the tip of the branch, which may have moved on.)
      - name: Cut the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--branch "$BRANCH")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release/cut-release.mjs "${args[@]}"

      # "Was a release cut" is answered by the repository, not by what the step
      # before printed: is there a vX.Y.Z tag of this commit's line on the
      # commit we checked out? That holds for both triggers, it is empty when
      # nothing was released (a commit nobody asked to release), and it is
      # still true on a re-run after a release whose image tagging failed. See
      # scripts/release/released-version.mjs.
      #
      # Not asked in a dry run. A dry run for a commit that is already
      # released would find its tag here, and the jobs below would then push
      # that release's image tags and chart: a dry run publishes nothing.
      - name: Was a release cut at this commit?
        id: released
        if: steps.plan.outputs.dry_run != 'true'
        run: |
          # pipefail, or a failing script would hide behind tee's exit 0.
          set -euo pipefail
          node scripts/release/released-version.mjs | tee -a "$GITHUB_OUTPUT"

  # Gives the release its container image tags.
  #
  # CI built the image for this commit and pushed it as sha-<commit> before any
  # of this started; nothing is built here. The job resolves that tag to its
  # digest and points X.Y.Z (and X.Y, when this is the newest patch of it) at the
  # same digest, so the versioned image is the one CI built for the released
  # commit, not a rebuild. X.Y is the release's own line. A patch cut from a
  # release branch moves that line's tag and nothing else: not `latest`, and
  # not the tag of the line main is on.
  #
  # X.Y.Z is written once. If CI was re-run in full for a commit that is already
  # released, sha-<commit> names a new build by now, and retag-image.sh fails
  # here rather than move the release onto it. See docs/releasing.md.
  #
  # A separate job so that the registry credentials are never in the job that
  # holds the repository permissions, and so that a registry hiccup can
  # be retried on its own ("Re-run failed jobs") without touching the release.
  tag-image:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Tag the image built for this commit with the release version
        env:
          SOURCE_TAG: ${{ needs.publish.outputs.source_tag }}
          IMAGE_TAGS: ${{ needs.publish.outputs.image_tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "$IMAGE_TAGS"
          scripts/retag-image.sh quay.io/gkrumbach07/openshell-dashboard "$SOURCE_TAG" "${tags[@]}"

  # Packaged from this commit with the image tag that tag-image just published.
  # Never re-push a stable OCI version; an existing version is left unchanged.
  publish-chart:
    needs: [publish, tag-image]
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Publish immutable versioned chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry="oci://ghcr.io/${GITHUB_REPOSITORY,,}/helm-chart"
          ref="$registry/openshell-dashboard"
          if helm show chart "$ref" --version "$VERSION" > "$RUNNER_TEMP/chart-lookup.log" 2>&1; then
            echo "Chart $ref:$VERSION already exists; leaving immutable version untouched."
            exit 0
          fi
          if ! grep -Eqi 'not found|manifest unknown|404' "$RUNNER_TEMP/chart-lookup.log"; then
            cat "$RUNNER_TEMP/chart-lookup.log"
            exit 1
          fi
          helm package deploy/helm/openshell-dashboard --version "$VERSION" \
            --app-version "$VERSION" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/openshell-dashboard-${VERSION}.tgz" "$registry"
