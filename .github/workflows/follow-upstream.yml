# Follow upstream OpenShell releases (ADR 0009, decisions 6, 7 and 8).
#
# A branch of this repository is built on ONE upstream release, named by
# deploy/ci/gateway-pins.json, and ci.yml tests every change against it. This
# workflow is what moves that pin. Every hour it reads upstream's git tags and
# picks a target:
#
#   the newest stable release (vX.Y.Z) above the one main pins, if there is one;
#   otherwise the newest pre-release (vX.Y.Z-pre.N) leading up to a release
#   above it; otherwise nothing, and the run ends.
#
# With a target it does two things, and they answer different questions.
#
#   next       Keeps the `next` branch: main, then ONE commit that moves the
#              pin (gateway and supervisor images, and the Go SDK at the tag's
#              commit, together), then whatever people put on it. `next` is
#              the bump pull request, opened early: a draft while the target is
#              a pre-release, ready for review once upstream cuts the stable
#              release. ci.yml running on that pull request is CHECK B, the
#              console built on the upcoming SDK against the upcoming gateway.
#
#   check A    Runs the compatibility suite with the BFF as main builds it
#              today against the target's gateway. That is what a console
#              already installed will meet when the gateway is upgraded under
#              it. A failure goes to one issue, rewritten in place and closed
#              when it passes again.
#
# This replaces the two-axis compat sweep (ADR 0006): moving to a release is
# one change now, not a gateway pull request and an SDK pull request.
#
# Invariants. Each is enforced in code, not only stated here:
#   1. Only vX.Y.Z and vX.Y.Z-pre.N are followed.     versions.py
#      dev / HEAD and @latest are never pinned.       pins.py, pinmove.py
#   2. Images are pinned by digest, and check A       plan.py
#      tests the digests `next` pins.
#   3. Every compat run uses -count=1.                tests/test_workflows.py
#   4. No ${{ }} inside a run: script; values         tests/test_workflows.py
#      reach scripts through env:.
#   5. Least-privilege permissions per job.           tests/test_workflows.py
#   6. The job that can write (next) builds and       tests/test_workflows.py
#      tests nothing and starts no container. It
#      runs git, `go get`, `go mod tidy`, a registry
#      lookup and this repository's own scripts.
#      Only its `gh` and `git push` steps see a
#      token, and those run nothing else.
#   7. The job that runs upstream's gateway image     tests/test_workflows.py
#      (check-a) can read the repository and
#      nothing more.
#   8. A conflict leaves `next` exactly as it was.    nextbranch.py
#   9. Only a pull request whose head is `next` in    publish.py
#      THIS repository is ever touched.
#
# All decision logic lives in deploy/ci/upstream/ with unit tests. This file
# only checks out, sets up toolchains and starts containers.
#
# TOKENS. The `next` job uses the secret UPSTREAM_BOT_TOKEN when it is set
# and the workflow's default token otherwise.
#   - With the default token, GitHub starts no workflow for what is pushed or
#     opened, so CI does not run on the `next` pull request by itself (its
#     description says what to press), and the repository setting "Allow
#     GitHub Actions to create and approve pull requests" has to be on for the
#     pull request to be opened at all. The default token may also never
#     create or update a workflow file, so GitHub can refuse the push of a
#     `next` that was rebased onto a main that changed one. That has not been
#     seen here yet; the job says what to do if it happens.
#   - UPSTREAM_BOT_TOKEN is a fine-grained or GitHub App token with Contents,
#     Pull requests and Workflows read/write on this repository. With it, CI
#     starts by itself.
#
# AUTO-MERGE is off unless the repository variable UPSTREAM_AUTOMERGE is
# `true`. Then a `next` pull request that is ready and on a stable release is
# set to merge by rebase once its required checks pass. The workflow only asks
# GitHub to turn auto-merge on. It never merges a pull request itself, and
# GitHub refuses the request while nothing is required of the pull request:
# it needs "Allow auto-merge" and at least one required check on main.
#
# A red run means the workflow itself broke, could not publish, or could not
# run check A. A finding never turns it red: a failing check A goes to the
# issue, and a conflict on `next` to a comment on its pull request.
name: Follow upstream

on:
  schedule:
    # Every hour, at 17 minutes past. Upstream cut 0.1.0, 0.1.1 and 0.1.2
    # inside four days, and the point of `next` is to have the move waiting
    # when a release lands, not a day later. Off the top of the hour, when
    # scheduled runs queue up behind everyone else's.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: say what would be done; push, open and edit nothing"
        type: boolean
        default: true

# Nothing by default. Every job asks for exactly what it uses.
permissions: {}

# `next`, its pull request and the issue are singletons; two runs that can
# write them would fight over them, so runs on main queue behind each other. A
# run from any other ref is a dry run that touches none of them. It gets a
# group of its own: GitHub keeps only ONE pending run per group, so two dry
# runs in the shared group could cancel the scheduled run that was waiting.
concurrency:
  group: follow-upstream-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  FOLLOW: python3 deploy/ci/upstream/follow.py
  # 'true' or 'false'. A scheduled run acts. A manual run acts only when its
  # box was cleared, and a run from anything but main never does.
  DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  plan:
    name: What is upstream ahead of main?
    # A fork inherits this file. On a schedule it must not start keeping a
    # `next` branch of its own; someone who starts it by hand there meant to.
    if: ${{ github.event_name != 'schedule' || !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pinned: ${{ steps.plan.outputs.pinned }}
      has_target: ${{ steps.plan.outputs.has_target }}
      ready: ${{ steps.plan.outputs.ready }}
      target: ${{ steps.plan.outputs.target }}
      same_line: ${{ steps.plan.outputs.same_line }}
      gateway_image: ${{ steps.plan.outputs.gateway_image }}
      supervisor_image: ${{ steps.plan.outputs.supervisor_image }}
      sandbox_image: ${{ steps.plan.outputs.sandbox_image }}
      config_schema: ${{ steps.plan.outputs.config_schema }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the upstream logic
        run: python3 -m unittest discover -s deploy/ci/upstream

      # Upstream's tags (git ls-remote) and the digests the target's images
      # have right now (docker buildx imagetools inspect). Resolved once, here,
      # so check A tests exactly the images `next` pins even if upstream pushes
      # a tag again while the run is going.
      - name: Find the release to follow
        id: plan
        run: |
          set -euo pipefail
          $FOLLOW plan --dry-run "$DRY_RUN" --out /tmp/upstream/plan.json --summary /tmp/upstream/plan.md
          cat /tmp/upstream/plan.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-plan
          path: /tmp/upstream/plan.json
          if-no-files-found: error
          retention-days: 7

  # The only job that can write to the repository, so it is the one that must
  # not run anything from upstream. It builds nothing, tests nothing and
  # starts no container. What it runs: git; `go get` and `go mod tidy`, which
  # download modules and execute none of them; a registry lookup when a lock
  # file has to be regenerated; and this repository's own scripts, from the
  # commit the workflow runs at.
  #
  # The token is not in the job's environment and is not left in the checkout
  # (persist-credentials: false). Two steps are handed it: the one that lists
  # the pull requests from `next`, and the one that publishes. Everything that
  # reaches the network for modules runs between them, without it.
  #
  # The work is done in a scratch worktree on a detached HEAD. Nothing is
  # pushed until all of it has succeeded, so a rebase that stops on a conflict
  # leaves `next` exactly as it was.
  next:
    name: Keep next on the upcoming release
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push next; create release/<line> before a new minor merges
      pull-requests: write   # open, rewrite, comment on or close the pull request from next
    env:
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # 'true' or 'false', never the secret: the pull request says whether CI
      # will start by itself.
      HAS_BOT_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN != '' }}
      AUTOMERGE: ${{ vars.UPSTREAM_AUTOMERGE == 'true' }}
    steps:
      # Every branch and all of history: `next` is rebased onto main, and
      # whether a release branch exists is read from what was fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # For `go get` and `go mod tidy` only. No cache is restored into a job
      # that can write.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      # For scripts/readme-gateway-range.mjs only.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: upstream-plan
          path: /tmp/upstream

      # `--head` matches the branch NAME, in this repository and in every
      # fork, so what comes back is only a list of candidates. Which of them
      # is ours is decided by publish.py from isCrossRepository. The merged
      # ones say whether what is on `next` has already reached main.
      - name: List the pull requests from next
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh pr list --head next --base main --state open --limit 100 \
            --json number,title,body,isDraft,headRefName,headRefOid,baseRefName,isCrossRepository,autoMergeRequest,comments \
            > /tmp/upstream/open.json
          gh pr list --head next --base main --state merged --limit 100 \
            --json number,headRefName,headRefOid,baseRefName,isCrossRepository \
            > /tmp/upstream/merged.json

      # No token here. Decides everything and pushes nothing: it leaves the
      # commit `next` should be on under a local ref, and the steps to take on
      # GitHub in publish.json.
      - name: Build what next should be
        env:
          # setup-go pins the toolchain to the one it installed. A release
          # whose SDK needs a newer Go has to be able to say so in go.mod, or
          # `next` could not be made for it at all; check B then shows what
          # else has to follow.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          $FOLLOW next --plan /tmp/upstream/plan.json \
            --open-prs /tmp/upstream/open.json --merged-prs /tmp/upstream/merged.json \
            --has-bot-token "$HAS_BOT_TOKEN" --automerge "$AUTOMERGE" --repo-url "$REPO_URL" \
            --dry-run "$DRY_RUN" --out /tmp/upstream/next
          cat /tmp/upstream/next/summary.md >> "$GITHUB_STEP_SUMMARY"

      # `publish` runs `git push` and `gh` with the arguments the step above
      # chose, and nothing else. In a dry run it prints them.
      - name: Push next and keep its pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          status=0
          $FOLLOW publish --plan /tmp/upstream/next/publish.json --dry-run "$DRY_RUN" \
            --summary /tmp/upstream/next/published.md || status=$?
          if [ -f /tmp/upstream/next/published.md ]; then
            cat /tmp/upstream/next/published.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Check A: the BFF exactly as main builds it, against the target's gateway.
  #
  # This is the job that runs upstream's gateway image, so it can read the
  # repository and nothing else, and no secret reaches it. backend/go.mod is
  # never modified here: the question is about the console we ship, on the SDK
  # it ships with.
  check-a:
    name: "Check A: main against OpenShell ${{ needs.plan.outputs.target }}"
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENSHELL_GATEWAY_IMAGE: ${{ needs.plan.outputs.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ needs.plan.outputs.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ needs.plan.outputs.config_schema }}
      # The same digest-pinned workload image as ci.yml's compat job: this
      # varies the gateway, not the workload.
      COMPAT_SANDBOX_IMAGE: ${{ needs.plan.outputs.sandbox_image }}
      # A target on main's own release line has to be judged "supported" by a
      # BFF that is told nothing. A target that starts a new line is judged
      # "unsupported", correctly, so nothing is asserted about it.
      COMPAT_EXPECT_COMPATIBILITY: ${{ needs.plan.outputs.same_line == 'true' && 'supported' || '' }}
      # With -mod=readonly Go refuses to change go.mod, and the diff below
      # proves it did not.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the BFF from the checked-in go.mod
        run: |
          set -euo pipefail
          (cd backend && go build -o ../bin/server ./cmd/server)
          git diff --exit-code -- backend/go.mod backend/go.sum

      # From here on a failing step is a RESULT, not an error, so it must not
      # fail the job. Each of the next four needs the one before it, and the
      # first that does not succeed names what happened: an image that cannot
      # be pulled, a gateway that never starts and a BFF that never becomes
      # healthy are all recorded as "could not be tested". No request reached
      # the gateway, so they say nothing about compatibility.
      - name: Pull images
        id: pull
        continue-on-error: true
        run: |
          set -euo pipefail
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # When the gateway does not become healthy, e2e-stack.sh prints its log
      # itself, before it tears the stack down: afterwards there is no
      # container left to ask.
      - name: Start gateway stack
        id: stack
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        id: bff
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: the suite talks to a live gateway, which Go's test cache
      # cannot see. A cached pass against the pinned gateway must never stand
      # in for this one.
      - name: Run compat suite
        id: compat
        if: steps.bff.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -v -timeout 20m ./test/compat/...

      - name: Record result
        env:
          PULL: ${{ steps.pull.outcome }}
          STACK: ${{ steps.stack.outcome }}
          BFF: ${{ steps.bff.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
        run: |
          set -euo pipefail
          $FOLLOW record-check --pull "$PULL" --stack "$STACK" --bff "$BFF" --compat "$COMPAT" \
            --out /tmp/upstream/check-a.json

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-check-a
          path: /tmp/upstream/check-a.json
          if-no-files-found: error
          retention-days: 7

      # Only while the stack is still up. A gateway that never started has
      # already printed its log from inside e2e-stack.sh.
      - name: Gateway logs
        if: always() && (steps.bff.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # Says what check A's result means and keeps the one issue. Runs when check
  # A was skipped, too: with nothing ahead of main, an issue about a release
  # main has since moved to must not stay open.
  #
  # !cancelled(), not always(): always() is true for a cancelled run too, so
  # pressing Cancel would not have stopped this job from rewriting the issue.
  report:
    name: Report check A
    needs: [plan, check-a]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream-plan
          path: /tmp/upstream
      - uses: actions/download-artifact@v4
        # No result is a state the report handles: check A was skipped, or it
        # broke before it could record one.
        continue-on-error: true
        with:
          name: upstream-check-a
          path: /tmp/upstream

      - name: Decide what the result means
        id: report
        run: |
          set -euo pipefail
          $FOLLOW check-report --plan /tmp/upstream/plan.json --result /tmp/upstream/check-a.json \
            --run-url "$RUN_URL" --repo-url "$REPO_URL" --dry-run "$DRY_RUN" --out /tmp/upstream/report
          cat /tmp/upstream/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Never in a dry run. Found by label, not by title: the title names the
      # release, which changes. Only OPEN issues count, so closing one means
      # "handled". The label is the retired compat sweep's, so its last issue
      # is taken over by the first run of this workflow.
      - name: Maintain the issue
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.report.outputs.issue_action }}
        run: |
          set -euo pipefail
          gh label create compat-migrate --color b60205 --force \
            --description "Follow upstream: main fails the compatibility suite against an upcoming OpenShell release" >/dev/null 2>&1 || true
          num=$(gh issue list --label compat-migrate --state open --json number --jq '.[0].number // empty')
          case "$ACTION" in
            upsert)
              title=$(cat /tmp/upstream/report/issue-title.txt)
              if [ -n "$num" ]; then
                gh api --method PATCH "repos/$GH_REPO/issues/$num" --silent \
                  -f title="$title" -F body=@/tmp/upstream/report/issue-body.md
                echo "rewrote issue #$num"
              else
                gh issue create --label compat-migrate --title "$title" \
                  --body-file /tmp/upstream/report/issue-body.md
              fi
              ;;
            close)
              if [ -n "$num" ]; then
                gh issue close "$num" --comment "$(cat /tmp/upstream/report/close-comment.md)"
              else
                echo "nothing to close: no issue is open"
              fi
              ;;
            *)
              # keep: the target's images are not published yet, or check A
              # could not be run. Nothing is known, so nothing is changed.
              echo "::notice::Check A reached no result this run, so the issue was left exactly as it is (see the summary)."
              ;;
          esac

      # "Could not be tested" is not a finding. It is the workflow not doing
      # its job, and that is what a red run is for.
      - name: Fail when check A could not be run
        env:
          INCOMPLETE: ${{ steps.report.outputs.incomplete }}
        run: |
          set -euo pipefail
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error::Check A did not reach a result (see the summary). Nothing was concluded from it and the issue was not touched."
            exit 1
          fi
