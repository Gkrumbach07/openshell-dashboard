name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package*.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm ci
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run lint
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run format:check
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run typecheck
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run build:lib
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm test -- --coverage --passWithNoTests
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        name: Verify packed package imports in Node ESM
        run: cd frontend && npm run verify:consumer

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        run: cd backend && go test -race -count=1 -coverprofile=coverage.out ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  # Gateway compatibility matrix.
  #
  # The BFF pins its SDK in go.mod; the gateway is a separate artifact with its
  # own release cadence. These drift silently, which is how the Sep 2026
  # breaking changes reached main unnoticed. This job runs the Go compat suite
  # (backend/test/compat) against several real gateway versions.
  #
  # `required: true` versions block the build. `latest` is informational: it is
  # allowed to fail so an upstream release does not red-wall unrelated PRs, but
  # a failure there is the early warning that a resync is due.
  compat:
    name: compat (gateway ${{ matrix.version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: the oldest gateway we claim to support. Bump deliberately.
          - version: "0.0.113"
            required: true
          - version: "0.0.115"
            required: true
          - version: "0.0.116"
            required: true
          # Tracks upstream HEAD — advisory only.
          - version: "latest"
            required: false
    env:
      # The community sandbox image publishes no semver tags, so it is pinned
      # by digest and held constant across the matrix: we are varying the
      # gateway, not the workload.
      COMPAT_SANDBOX_IMAGE: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: |
          set -euo pipefail
          docker pull "ghcr.io/nvidia/openshell/gateway:${{ matrix.version }}"
          docker pull "ghcr.io/nvidia/openshell/supervisor:${{ matrix.version }}"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      - name: Report resolved image digests
        run: |
          set -euo pipefail
          for img in "ghcr.io/nvidia/openshell/gateway:${{ matrix.version }}" \
                     "ghcr.io/nvidia/openshell/supervisor:${{ matrix.version }}" \
                     "$COMPAT_SANDBOX_IMAGE"; do
            echo "$img -> $(docker image inspect "$img" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo 'no digest')"
          done

      - name: Start gateway stack
        env:
          OPENSHELL_VERSION: ${{ matrix.version }}
        run: deploy/ci/e2e-stack.sh up

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and start BFF
        run: |
          set -euo pipefail
          cd backend && go build -o ../bin/server ./cmd/server && cd ..
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          timeout 60 bash -c 'until curl -sf http://localhost:9080/api/v1/healthz >/dev/null; do sleep 1; done'
          echo "BFF is healthy"

      - name: Run compat suite
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -v -timeout 20m ./test/compat/...

      - name: Gateway logs on failure
        if: failure()
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down


  build:
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: ${{ env.PUBLISH_IMAGE == 'true' && 'type=image,name=quay.io/gkrumbach07/openshell-dashboard,push-by-digest=true,name-canonical=true,push=true' || '' }}
      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-
            type=ref,event=pr,prefix=pr-
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/gkrumbach07/openshell-dashboard@sha256:%s ' *)
