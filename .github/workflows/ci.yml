name: CI

# Every change is tested against the gateway pinned by the branch it merges
# into (ADR 0009, decision 6), so this runs for all three kinds of branch:
#
#   main          one stable upstream release
#   release/X.Y   the line before it, for critical and security fixes
#   next          the upcoming release, usually a pre-release. A pull request
#                 into `next` is work that needs it; the pull request from
#                 `next` into main is the move itself, and this workflow
#                 running there is "check B" (follow-upstream.yml).
#
# Nothing runs on a push to `next`: it is rebased and force-pushed, and its
# pull request into main already tests every commit that lands on it.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, next, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - name: Render and lint all chart overlays
        run: make helm-lint
      - name: Package chart
        run: helm package deploy/helm/openshell-dashboard --version 0.0.0-dev --app-version sha-test --destination "$RUNNER_TEMP"
      - name: Helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
          make helm-test
      - uses: jdx/mise-action@v4
      - name: Generated chart README is current
        run: |
          make helm-docs
          git diff --exit-code -- deploy/helm/openshell-dashboard/README.md

  # On a pull request the two check-* jobs do their work only when their half
  # of the tree changed. On a push, to main or to a release branch, they always
  # do: that is the run a release is cut from.
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package*.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        run: cd frontend && npm ci
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        run: cd frontend && npm run lint
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        run: cd frontend && npm run format:check
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        run: cd frontend && npm run typecheck
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'push'
        run: cd frontend && npm test -- --coverage --passWithNoTests

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
      - if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        run: cd backend && go test -race -count=1 -coverprofile=coverage.out ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm start
          wait-on: "http://localhost:3000"
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  # Gateway compatibility (ADR 0005 as amended by ADR 0006 and ADR 0009).
  #
  # A branch is built on ONE upstream release, and deploy/ci/gateway-pins.json
  # names it: the gateway and supervisor images, and the Go SDK at the commit
  # upstream tagged that release with. Every change is tested against that
  # gateway, whichever branch it merges into.
  #
  # The version chain is gateway -> SDK -> BFF -> UI. The `compat` job below
  # proves the WIRE link (gateway<->SDK), which nothing but a real gateway can
  # prove. The SOURCE link (SDK<->BFF) is check-backend's job: the compiler
  # and the unit tests.
  #
  # compat-pins reads the pins file and fails fast when it is malformed: an
  # image without @sha256:, an image tagged with another release, a dev build,
  # a release that is neither X.Y.Z nor X.Y.Z-pre.N, or an `sdk` field that
  # disagrees with backend/go.mod.
  #
  # The gateway release line this build is for is the major.minor of the
  # pinned release. It is compiled into the BFF, and release-tooling below
  # fails when that constant and the pins disagree.
  compat-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.read.outputs.release }}
      gateway_image: ${{ steps.read.outputs.gateway_image }}
      supervisor_image: ${{ steps.read.outputs.supervisor_image }}
      config_schema: ${{ steps.read.outputs.config_schema }}
      sandbox_image: ${{ steps.read.outputs.sandbox_image }}
    steps:
      - uses: actions/checkout@v4
      # The validator below and the Follow upstream workflow share this code.
      # A few seconds of unit tests here keep both honest on every PR.
      - name: Unit-test the pins and upstream logic
        run: python3 -m unittest discover -s deploy/ci/upstream
      - name: Validate the pins file
        run: python3 deploy/ci/upstream/follow.py validate-pins deploy/ci/gateway-pins.json --go-mod backend/go.mod
      - id: read
        run: |
          set -euo pipefail
          for key in release gateway_image supervisor_image config_schema sandbox_image; do
            echo "$key=$(jq -er --arg key "$key" '.[$key]' deploy/ci/gateway-pins.json)" >> "$GITHUB_OUTPUT"
          done

  # NOT a compatibility result. It answers one question: does this branch pin
  # a stable upstream release?
  #
  # `main` and `release/**` pin stable releases only. `next` pins the upcoming
  # release, which is a pre-release until upstream cuts the stable one, so the
  # pull request from `next` into main fails HERE, by name, for as long as that
  # lasts. That is what keeps it from merging, and it is kept apart from
  # `compat` on purpose: a red `compat` means the console does not work with
  # the gateway, and a red check here only means "not released upstream yet".
  # The Follow upstream workflow re-pins `next` when the stable release is out.
  #
  # A pull request INTO `next` is work that needs the pre-release, so the job
  # does not run there.
  stable-release:
    name: pins a stable release
    if: github.event_name == 'push' || github.base_ref != 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The pins name a stable OpenShell release, not a pre-release
        run: python3 deploy/ci/upstream/follow.py require-stable deploy/ci/gateway-pins.json

  # The compatibility suite against the one gateway this branch pins.
  #
  # The gateway is a RELEASE pinned by digest: a stable release, or on `next` a
  # pre-release. Never a `dev` build. A dev gateway resolves a moving
  # ghcr.io/nvidia/openshell/sandbox:dev image at runtime, so even pinned by
  # digest it drifts with upstream HEAD, which is what turned this job red on
  # main on 2026-10-02 with no change on our side.
  #
  # Looking ahead, at the releases upstream has tagged since, is not something
  # every PR pays for: follow-upstream.yml does it on a schedule.
  #
  # Why the wire link cannot be assumed: between 0.0.116 and 0.1.0 upstream
  # replaced `string workspace` on every request with a WorkspaceSelector
  # message, and 0.1.0 put it at the field numbers the string had
  # (GetSandboxRequest 2, ListSandboxesRequest 4, ...). A 0.0.116 gateway
  # therefore reads the serialized selector as a workspace NAME and reports
  # `workspace '\n\adefault' not found` on every workspace-scoped call. That
  # gateway is served by dashboard v0.2.0 and its 0.2.x maintenance line, not
  # by main (ADR 0006).
  #
  # A wire break is not always that loud. Dashboard v0.3.0 sent the selector
  # at field numbers 0.0.116 does not know; protobuf dropped them, every
  # request landed in the `default` workspace, and nothing failed. This job
  # proves what the compat suite varies, and only that.
  #
  # The gateway's own TOML config is versioned too, and the schemas are
  # mutually exclusive: 0.1.0 and newer require v2, releases up to 0.0.116
  # require v1. The pins therefore name the config template.
  #
  # The job has one fixed name, `compat`, whatever release is pinned, so that a
  # branch protection rule can require it and keep requiring it after a move.
  compat:
    needs: compat-pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PINNED_RELEASE: ${{ needs.compat-pins.outputs.release }}
      # The community sandbox image publishes no semver tags, so it is pinned
      # by digest in gateway-pins.json and does not move with the gateway.
      COMPAT_SANDBOX_IMAGE: ${{ needs.compat-pins.outputs.sandbox_image }}
      # Read by deploy/ci/e2e-stack.sh. Passed through env rather than written
      # into the scripts below, so no workflow expression is ever expanded
      # inside a shell command.
      OPENSHELL_GATEWAY_IMAGE: ${{ needs.compat-pins.outputs.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ needs.compat-pins.outputs.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ needs.compat-pins.outputs.config_schema }}
      # The BFF under test is told nothing about gateways: like a released
      # image, it judges them against the release line compiled into it, and
      # the pinned gateway has to be judged "supported". It is a release of
      # that line, so any other verdict means the line in the BFF is not the
      # pins' line, the comparison broke, or the gateway's version report
      # changed.
      COMPAT_EXPECT_COMPATIBILITY: supported
    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: |
          set -euo pipefail
          echo "gateway under test: OpenShell $PINNED_RELEASE"
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"
          echo "sandbox image digest: $(docker image inspect "$COMPAT_SANDBOX_IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo unknown)"

      - name: Start gateway stack
        run: |
          set -euo pipefail
          # Sandbox containers are created by the gateway on the host daemon,
          # so they are siblings of the gateway container and do not inherit
          # its compose extra_hosts aliases. Reach the gateway's published port
          # via the docker bridge gateway address instead of a host alias.
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "docker bridge gateway: $BRIDGE"
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and start BFF
        run: |
          set -euo pipefail
          cd backend && go build -o ../bin/server ./cmd/server && cd ..
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null
          echo "BFF is healthy"

      # -count=1 is load-bearing. The suite talks to a live gateway, which Go's
      # test cache cannot see: with identical test inputs it replays a previous
      # pass as "ok (cached)" without sending a single request — and setup-go
      # restores GOCACHE between runs. Never let a cached result stand in.
      - name: Run compat suite
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -v -timeout 20m ./test/compat/...

      - name: Gateway logs on failure
        if: failure()
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  build:
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The image states which gateway release line it is for, and the SDK it
      # was built against, as labels. The values come from the same script
      # that writes the release notes, which derives them from the release the
      # pins name — nothing here is typed by hand, and a pins file that
      # yields no line fails the build rather than shipping an image that
      # claims nothing. The BFF does not read the labels: its line is compiled
      # in, and release-tooling holds that constant to the same pins.
      - name: Derive the gateway release line
        id: gateway
        run: |
          # pipefail, or a failing derivation would hide behind tee's exit 0.
          set -euo pipefail
          node scripts/gateway-range.mjs --format github | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # DASHBOARD_COMMIT is what the About dialog shows as the commit the
          # image is built from. It is the commit this run is for, the same
          # one the image's sha-<7> tag is made from: on a pull request that
          # is the merge commit GitHub tests, not the head of the branch.
          build-args: |
            GATEWAY_RELEASE_LINE=${{ steps.gateway.outputs.line }}
            OPENSHELL_SDK_VERSION=${{ steps.gateway.outputs.sdk }}
            DASHBOARD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: ${{ env.PUBLISH_IMAGE == 'true' && 'type=image,name=quay.io/gkrumbach07/openshell-dashboard,push-by-digest=true,name-canonical=true,push=true' || '' }}
      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two per-platform images into one multi-arch image and tags it with
  # the commit (and the PR number, on a pull request). It needs only `build`,
  # deliberately: these tags say "this is what that commit built", which is true
  # whether or not the commit is any good, and they are how a pull request gets
  # an image to try before its checks finish. That includes a pull request into
  # `next` and the pull request from `next` into main: both get `pr-<n>` and
  # `sha-<7>`, built on the pre-release's SDK.
  #
  # It does NOT tag `latest`. That tag is a recommendation, and it used to move
  # here — on every push to main, with only `build` to wait for — so it could
  # and did point at a commit whose compat job had failed.
  # `promote-latest` below moves it, once everything has passed.
  push-manifest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
          # sha-<first 7 characters of the commit> is how every later tag finds
          # this image: promote-latest below, and the version tags publish.yml
          # adds when a release is cut. Keep the format in step with both.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/gkrumbach07/openshell-dashboard@sha256:%s ' *)

  # Reads the image that push-manifest just pushed back from the registry and
  # checks that its labels declare the gateway release line and the SDK on both
  # platforms.
  #
  # Nothing else would notice if they did not. The Dockerfile's build args
  # default to the empty string so that a plain `docker build` works, which also
  # means a misspelt arg name in the build job above is not an error: the image
  # is published with empty labels. This inspects the image config; it does not
  # pull or run the image.
  image-range:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [push-manifest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      - name: The pushed image declares its gateway release line
        run: node scripts/check-image-range.mjs "quay.io/gkrumbach07/openshell-dashboard:sha-${GITHUB_SHA::7}"

  # `latest` only moves to a commit that passed everything, and only forward.
  #
  # This is a retag, not a build: it points `latest` at the digest that
  # push-manifest already pushed as sha-<commit>, so `latest` is byte-for-byte
  # the image built for the commit whose jobs passed, not a later rebuild of it.
  # On a pull request, or if any job in `needs` fails or is cancelled, this job
  # is skipped and `latest` stays where it was.
  #
  # "Passed everything" is not enough on its own. A run can be re-run for
  # thirty days and keeps the commit it was started for, and this job depends on
  # every other job, so re-running a failed job on an OLDER run of main runs
  # this one too. Without the tip check below, "Re-run failed jobs" on last
  # week's flaky run would finish green and pull `latest` back to last week. So
  # the job first asks the remote whether its commit is still the tip of main,
  # and when it is not it stands down: it succeeds, touches nothing and never
  # logs in to the registry. The run for the tip is the one that promotes.
  #
  # publish.yml only runs after this workflow succeeds on main, so by the time
  # a release is cut `latest` and the new X.Y.Z tag name the same digest.
  #
  # Only main promotes. A push to a release branch builds and tests the same
  # way and gets its `sha-<7>` image, and `latest` is not its to move.
  promote-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      [
        push-manifest,
        image-range,
        helm,
        check-frontend,
        check-backend,
        e2e,
        stable-release,
        compat,
        release-tooling,
      ]
    steps:
      - uses: actions/checkout@v4
      - name: Is this commit still the tip of main?
        id: tip
        run: |
          # pipefail, or a failing check would hide behind tee's exit 0.
          set -euo pipefail
          scripts/branch-tip.sh origin main "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.tip.outputs.is_tip == 'true'
      - uses: docker/login-action@v3
        if: steps.tip.outputs.is_tip == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Point latest at this commit's image
        if: steps.tip.outputs.is_tip == 'true'
        run: scripts/retag-image.sh quay.io/gkrumbach07/openshell-dashboard "sha-${GITHUB_SHA::7}" latest

  # Dev charts are deliberately floating. Stable chart versions are published
  # only from publish.yml after the versioned container image has been tagged.
  publish-dev-chart:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [promote-latest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Is this commit still the tip of main?
        id: tip
        run: |
          set -euo pipefail
          scripts/branch-tip.sh origin main "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Publish floating development chart
        if: steps.tip.outputs.is_tip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          helm package deploy/helm/openshell-dashboard --version 0.0.0-dev \
            --app-version "sha-${GITHUB_SHA::7}" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/openshell-dashboard-0.0.0-dev.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY,,}/helm-chart"

  # The release pipeline (publish.yml, scripts/release/) runs for real only on
  # main and on release branches, after a merge. This job is where a mistake in
  # it is caught beforehand, and it is also where the supported gateway release
  # line is kept honest:
  #
  #   - the line can be derived from the pins, the line compiled into the BFF
  #     (backend/pkg/models/gateway_release_line.go) is that line, and the SDK
  #     the pins name is the one backend/go.mod builds against
  #   - the README's Compatibility section states that line (it is generated;
  #     this fails when someone moved the pins and did not regenerate it)
  #   - the scripts that work out the version of a release, write its notes,
  #     cut it, detect it, decide whether `latest` may move and retag the image
  #     do what they say, against throwaway git repositories, a stand-in `gh`
  #     and a stand-in docker
  #   - the two steps of publish.yml that are shell written in the workflow
  #     file decide what they are meant to: the tests run them
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The built-in gateway release line and the SDK pin match the pins
        run: node scripts/gateway-range.mjs --check
      - name: README states the supported gateway release line
        run: node scripts/readme-gateway-range.mjs --check
      - name: Release script tests
        run: node --test "scripts/**/*.test.mjs"
