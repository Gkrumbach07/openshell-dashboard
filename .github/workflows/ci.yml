name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package*.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm ci
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run lint
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run format:check
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run typecheck
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run build:lib
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm test -- --coverage --passWithNoTests
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        name: Verify packed package imports in Node ESM
        run: cd frontend && npm run verify:consumer

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        run: cd backend && go test -race -count=1 -coverprofile=coverage.out ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  # Gateway compatibility (ADR 0005 as amended by ADR 0006).
  #
  # The version chain is gateway -> SDK -> BFF -> UI, and each link is proven
  # separately. The two jobs below prove the WIRE link (gateway<->SDK), which
  # nothing but a real gateway can prove: the newest gateway is not assumed to
  # work with the newest SDK, in either direction. The SOURCE link (SDK<->BFF)
  # is check-backend's job — the compiler and the unit tests.
  #
  # compat-pins reads deploy/ci/gateway-pins.json, the one place the supported
  # gateways are written down, and fails fast when that file is malformed: no
  # required lane, a lane image without @sha256:, a version that is not x.y.z,
  # a dev lane, or an `sdk` field that disagrees with backend/go.mod.
  #
  # The supported range is DERIVED, never restated: the floor is the lowest
  # and the ceiling the highest `version` among the lanes with required=true.
  compat-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.read.outputs.lanes }}
      sandbox_image: ${{ steps.read.outputs.sandbox_image }}
    steps:
      - uses: actions/checkout@v4
      # The validator below and the scheduled sweep share this code. A second
      # of unit tests here keeps both honest on every PR.
      - name: Unit-test the pins and sweep logic
        run: python3 -m unittest discover -s deploy/ci/sweep
      - name: Validate the pins file
        run: python3 deploy/ci/sweep/sweep.py validate-pins deploy/ci/gateway-pins.json --go-mod backend/go.mod
      - id: read
        run: |
          set -euo pipefail
          echo "lanes=$(jq -c '.lanes' deploy/ci/gateway-pins.json)" >> "$GITHUB_OUTPUT"
          echo "sandbox_image=$(jq -er '.sandbox_image' deploy/ci/gateway-pins.json)" >> "$GITHUB_OUTPUT"

  # One job per lane in deploy/ci/gateway-pins.json.
  #
  # A PR tests the PINS — the oldest and the newest released gateway this
  # dashboard claims to work with — and nothing else. Looking at other
  # releases, at upstream HEAD and at newer SDKs is the scheduled sweep's job
  # (compat-sweep.yml), not something every PR should pay for.
  #
  # Lanes are RELEASES pinned by digest. A `dev` gateway resolves a moving
  # ghcr.io/nvidia/openshell/sandbox:dev image at runtime, so even a
  # digest-pinned dev lane drifts with upstream HEAD — that is what turned
  # this job red on main on 2026-10-02 with no change on our side.
  #
  # `required: true` lanes block the build; advisory lanes may fail.
  #
  # Why the wire link cannot be assumed: the Sep 2026 SDK renumbered
  # CreateSandboxRequest's protobuf fields, moving workspace_scope from field 8
  # to field 7 — where gateways up to 0.0.116 expect a string. Such a gateway
  # reads the serialized WorkspaceSelector as a workspace name and reports
  # `workspace '\n\adefault' not found` on every workspace-scoped call. That
  # gateway is served by the 0.x maintenance line, not by main.
  #
  # The gateway's own TOML config is versioned too, and the schemas are
  # mutually exclusive: 0.1.0 and newer require v2, releases up to 0.0.116
  # require v1. Each lane therefore names its config template.
  compat:
    name: compat (gateway ${{ matrix.label }})
    needs: compat-pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compat-pins.outputs.lanes) }}
    env:
      # The community sandbox image publishes no semver tags, so it is pinned
      # by digest in gateway-pins.json and held constant across the matrix: we
      # are varying the gateway, not the workload.
      COMPAT_SANDBOX_IMAGE: ${{ needs.compat-pins.outputs.sandbox_image }}
      # Read by deploy/ci/e2e-stack.sh. Passed through env rather than written
      # into the scripts below, so no workflow expression is ever expanded
      # inside a shell command.
      OPENSHELL_GATEWAY_IMAGE: ${{ matrix.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ matrix.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ matrix.config_schema }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: |
          set -euo pipefail
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"
          echo "sandbox image digest: $(docker image inspect "$COMPAT_SANDBOX_IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo unknown)"

      - name: Start gateway stack
        run: |
          set -euo pipefail
          # Sandbox containers are created by the gateway on the host daemon,
          # so they are siblings of the gateway container and do not inherit
          # its compose extra_hosts aliases. Reach the gateway's published port
          # via the docker bridge gateway address instead of a host alias.
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "docker bridge gateway: $BRIDGE"
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and start BFF
        run: |
          set -euo pipefail
          cd backend && go build -o ../bin/server ./cmd/server && cd ..
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null
          echo "BFF is healthy"

      # -count=1 is load-bearing. The suite talks to a live gateway, which Go's
      # test cache cannot see: with identical test inputs it replays a previous
      # pass as "ok (cached)" without sending a single request — and setup-go
      # restores GOCACHE between runs. Never let a cached result stand in.
      - name: Run compat suite
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -v -timeout 20m ./test/compat/...

      - name: Gateway logs on failure
        if: failure()
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down


  build:
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: ${{ env.PUBLISH_IMAGE == 'true' && 'type=image,name=quay.io/gkrumbach07/openshell-dashboard,push-by-digest=true,name-canonical=true,push=true' || '' }}
      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-
            type=ref,event=pr,prefix=pr-
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/gkrumbach07/openshell-dashboard@sha256:%s ' *)
