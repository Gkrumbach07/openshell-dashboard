name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package*.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm ci
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run lint
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run format:check
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm run typecheck
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        run: cd frontend && npm test -- --coverage --passWithNoTests

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        run: cd backend && go test -race -count=1 -coverprofile=coverage.out ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  e2e-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache gateway image
        id: gateway-cache
        uses: actions/cache@v4
        with:
          path: /tmp/gateway-image.tar
          key: gateway-image-${{ hashFiles('deploy/ci/gateway.e2e.toml') }}

      - name: Load or pull gateway image
        run: |
          if [ -f /tmp/gateway-image.tar ]; then
            docker load -i /tmp/gateway-image.tar
          else
            docker pull ghcr.io/nvidia/openshell/gateway:latest
            docker save ghcr.io/nvidia/openshell/gateway:latest -o /tmp/gateway-image.tar
          fi

      - name: Generate gateway JWT keys
        run: |
          sudo mkdir -p /var/lib/openshell/jwt
          sudo openssl genpkey -algorithm Ed25519 -out /var/lib/openshell/jwt/signing.pem 2>/dev/null
          sudo openssl pkey -in /var/lib/openshell/jwt/signing.pem -pubout -out /var/lib/openshell/jwt/public.pem 2>/dev/null
          sudo openssl rand -hex 16 | sudo tee /var/lib/openshell/jwt/kid > /dev/null
          sudo chmod -R 755 /var/lib/openshell/jwt

      - name: Start OpenShell gateway
        run: |
          sudo mkdir -p /var/lib/openshell
          docker compose -f deploy/ci/docker-compose.e2e.yml up -d
          echo "Waiting for gateway to be healthy..."
          timeout 300 bash -c 'until curl -sf http://localhost:50052/healthz; do sleep 3; done' || {
            echo "Gateway failed to start — dumping logs:"
            docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=100
            exit 1
          }
          echo "Gateway is healthy"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and start BFF
        run: |
          cd backend && go build -o ../bin/server ./cmd/server
          cd ..
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:50051 ./bin/server &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/api/v1/healthz; do sleep 1; done'
          echo "BFF is healthy"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci

      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          config-file: cypress.config.integration.ts
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
        env:
          BFF_URL: http://localhost:8080

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-integration-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker compose -f deploy/ci/docker-compose.e2e.yml down -v
          docker ps -aq --filter "name=openshell-e2e" | xargs -r docker rm -f

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=quay.io/gkrumbach07/openshell-dashboard,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-
            type=ref,event=pr,prefix=pr-
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/gkrumbach07/openshell-dashboard@sha256:%s ' *)
