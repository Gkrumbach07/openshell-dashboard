name: CI

# The 0.2.x maintenance line's copy of this workflow. GitHub runs the copy that
# is on the branch being pushed (for a pull request, on its merge into the
# base), so this file only ever sees 0.2.x and main's copy only ever sees main.
on:
  push:
    branches: ['0.2.x']
  pull_request:
    branches: ['0.2.x']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package*.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm ci
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm run lint
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm run format:check
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm run typecheck
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm run build:lib
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd frontend && npm test -- --coverage --passWithNoTests
      - if: steps.filter.outputs.frontend == 'true' || github.ref == 'refs/heads/0.2.x'
        name: Verify packed package imports in Node ESM
        run: cd frontend && npm run verify:consumer

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/0.2.x'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/0.2.x'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
      - if: steps.filter.outputs.backend == 'true' || github.ref == 'refs/heads/0.2.x'
        run: cd backend && go test -race -count=1 -coverprofile=coverage.out ./...

  # Tests for the shell helpers the workflows call. released-version.sh decides
  # in publish.yml whether an image gets a version tag; a manual release is the
  # only time it runs for real, which is too late to find out it is wrong.
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/ci/released-version.test.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  # The dashboard against a real gateway: the Cypress integration specs drive
  # the BFF, which talks to the one gateway release this line supports.
  #
  # This job is REQUIRED: gateway 0.0.116 is the only gateway this line
  # supports, so when it fails the line is broken. It used to load
  # gateway:latest and supervisor:latest from an actions/cache entry under a
  # constant key — a snapshot that was never refreshed and that nobody could
  # name — and it ran with continue-on-error, so it tested an unknown gateway
  # and could not fail.
  #
  # Now deploy/ci/e2e-stack.sh pulls the gateway, the supervisor and the
  # sandbox image by the digests in deploy/ci/gateway-pins.json and nothing is
  # cached, so every run tests exactly those three images. There is no
  # continue-on-error: a failure here fails the run, and publish.yml will not
  # release a commit whose CI run is not green.
  e2e-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the pinned OpenShell gateway
        run: deploy/ci/e2e-stack.sh up

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and start BFF
        run: |
          cd backend && go build -o ../bin/server ./cmd/server
          cd ..
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          timeout 30 bash -c 'until curl -sf http://localhost:9080/api/v1/healthz; do sleep 1; done'
          echo "BFF is healthy"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci

      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          config-file: cypress.config.integration.ts
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
        env:
          BFF_URL: http://localhost:9080

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-integration-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Gateway logs on failure
        if: failure()
        run: deploy/ci/e2e-stack.sh logs --tail=200

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  build:
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: ${{ env.PUBLISH_IMAGE == 'true' && 'type=image,name=quay.io/gkrumbach07/openshell-dashboard,push-by-digest=true,name-canonical=true,push=true' || '' }}
      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      # An image built from this line must never be tagged `latest`. That tag
      # is main's (1.x); a 0.2.x image under it would hand everyone who pulls
      # the default a dashboard that only works with gateway 0.0.116. So
      # there is no `latest` rule below, and `flavor: latest=false` stops the
      # action from adding one of its own accord. A push to 0.2.x moves the
      # `0.2.x` tag instead. Every build also gets its commit (sha-<7>), a
      # pull request gets pr-<n>, and publish.yml adds X.Y.Z to the sha-<7>
      # image when a release is cut.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/gkrumbach07/openshell-dashboard
          flavor: |
            latest=false
          tags: |
            type=raw,value=0.2.x,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/0.2.x' }}
            type=sha,prefix=sha-
            type=ref,event=pr,prefix=pr-
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'quay.io/gkrumbach07/openshell-dashboard@sha256:%s ' *)
