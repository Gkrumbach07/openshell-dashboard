# A Keycloak for trying the dashboard on a throwaway cluster: dev mode, no
# database, nothing persists across a restart. Not for production.
# README.md, next to this file, has the commands. Apply it with -n keycloak.
#
# It expects, in that namespace:
#   Secret keycloak-tls         tls.crt and tls.key, for the name
#                               keycloak.keycloak.svc.cluster.local
#   Secret keycloak-admin       username and password of the bootstrap admin
#   ConfigMap openshell-realm   ../openshell-realm.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8
          args: [start-dev, --import-realm]
          env:
            # One issuer URL, the same from a pod and through a port-forward.
            - name: KC_HOSTNAME
              value: https://keycloak.keycloak.svc.cluster.local:8443
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/keycloak/tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/keycloak/tls/tls.key
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: username}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: password}
          ports:
            - name: https
              containerPort: 8443
          # Ready when the imported realm answers.
          readinessProbe:
            httpGet:
              path: /realms/openshell/.well-known/openid-configuration
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: tls
              mountPath: /etc/keycloak/tls
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: keycloak-tls
        - name: realm
          configMap:
            name: openshell-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
