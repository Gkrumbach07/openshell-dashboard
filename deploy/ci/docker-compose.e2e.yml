# Compat stack: a real OpenShell gateway (Docker driver) for the Go compat
# suite in backend/test/compat. Brought up by e2e-stack.sh, which pins the
# image version and renders .rendered/gateway.toml — do not run compose
# directly or the config bind will be missing.
#
# The gateway creates real Docker containers as sandboxes via DooD
# (Docker-outside-of-Docker) through the mounted Docker socket.
services:
  gateway:
    image: ${OPENSHELL_GATEWAY_IMAGE:-ghcr.io/nvidia/openshell/gateway:latest}
    command: []
    user: "0"
    ports:
      - "8080:8080"
      - "127.0.0.1:50052:8081"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - type: bind
        source: ${OPENSHELL_STATE_DIR:-/var/lib/openshell}
        target: /var/lib/openshell
        bind:
          create_host_path: true
      - type: bind
        source: ./.rendered/gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
      - type: bind
        source: ${OPENSHELL_STATE_DIR:-/var/lib/openshell}/jwt
        target: /var/lib/openshell/jwt
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
