{{- if and .Values.httpRoute.enabled .Values.httpRoute.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.httpRoute.gateway.name | default (include "openshell-dashboard.fullname" .) }}
  labels:
    {{- include "openshell-dashboard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.httpRoute.gateway.className }}
  listeners:
    - name: {{ ternary "https" "http" (eq .Values.httpRoute.gateway.listener.protocol "HTTPS") }}
      port: {{ .Values.httpRoute.gateway.listener.port }}
      protocol: {{ .Values.httpRoute.gateway.listener.protocol }}
      {{- if eq .Values.httpRoute.gateway.listener.protocol "HTTPS" }}
      tls:
        mode: Terminate
        certificateRefs:
          {{- toYaml .Values.httpRoute.gateway.listener.tls.certificateRefs | nindent 10 }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.httpRoute.gateway.listener.allowedRoutes }}
{{- end }}
