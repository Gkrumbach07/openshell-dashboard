# Attach to an existing HTTPS Gateway; it terminates TLS and forwards HTTP to
# oauth2-proxy, preserving the original Host header for terminal WebSockets.
# The Gateway's listener has to admit routes from the dashboard's namespace.
httpRoute:
  enabled: true
  hostnames: [dashboard.example.com]
  gateway:
    create: false
    name: ingress
    namespace: openshell-ingress
    # The name of the Gateway's HTTPS listener.
    sectionName: https
    listener:
      protocol: HTTPS
networkPolicy:
  # The namespace of the Gateway's data-plane pods.
  ingressNamespace: envoy-gateway-system
