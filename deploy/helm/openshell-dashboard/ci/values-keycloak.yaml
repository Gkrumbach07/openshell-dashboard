# Example Keycloak OIDC settings. Replace the issuer with a URL reachable by both
# browser and pods, matching the gateway's server.oidc.issuer.
# Layer values-route-edge.yaml and values-openshift-scc.yaml for OpenShift.
# Add an audience mapper to the dashboard client so its access and id token aud
# contains openshell-dashboard or specified dashboard audience.
# If not using client roles on an API client, a role mapping must be added for the gateway's expected audience
# Register https://<dashboard-host>/oauth2/callback.
oidc:
  provider: keycloak-oidc
  issuer: https://keycloak.apps.example.com/realms/openshell
  audience: openshell-cli
  rolesClaim: realm_access.roles
  adminRole: openshell-admin
  clientId: openshell-dashboard
  allowedRoles:
    - openshell-api:openshell-admin
    - openshell-api:openshell-user
  existingSecret: openshell-dashboard-oidc
  codeChallengeMethod: S256
