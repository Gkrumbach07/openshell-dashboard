# Example Keycloak OIDC settings. Replace the issuer with a URL reachable by both
# browser and pods, matching the gateway's server.oidc.issuer.
# Layer values-route-edge.yaml and values-openshift-scc.yaml for OpenShift.
# Assign openshell-api client roles to Keycloak groups, then scope the dashboard
# client to those roles. Keep Keycloak's built-in roles client scope: Audience
# Resolve adds openshell-api to the access token aud when a role is present.
# No custom audience mapper is needed. The gateway must use the same audience,
# rolesClaim, adminRole, and userRole. Register the dashboard callback URL in
# Valid redirect URIs and https://<dashboard-host>/oauth2/sign_in in Valid post
# logout redirect URIs for the dashboard client.
oidc:
  provider: keycloak-oidc
  issuer: https://keycloak.apps.example.com/realms/openshell
  audience: openshell-api
  rolesClaim: resource_access.openshell-api.roles
  adminRole: openshell-admin
  clientId: openshell-dashboard
  allowedRoles:
    - openshell-api:openshell-admin
    - openshell-api:openshell-user
  existingSecret: openshell-dashboard-oidc
  codeChallengeMethod: S256
