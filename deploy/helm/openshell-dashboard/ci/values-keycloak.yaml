# Keycloak as the identity provider, with the realm of
# deploy/keycloak/openshell-realm.json. Add one way to reach the dashboard:
# values-gateway-api.yaml, values-route-edge.yaml or values-port-forward.yaml.
#
# What has to agree with the gateway's OIDC settings:
#   issuer        the gateway's issuer, at a URL browsers and pods both reach
#   adminRole     the gateway's admin role
#   allowedRoles  the gateway's admin role and user role, each written as
#                 <the client that holds the role>:<role>
#
# What has to agree with the Keycloak client:
#   clientId, and its client secret in the Secret named by existingSecret
#   codeChallengeMethod: the client requires PKCE with S256
#   https://<dashboard host>/oauth2/callback is a valid redirect URI
#   https://<dashboard host>/* is a valid post logout redirect URI
oidc:
  provider: keycloak-oidc
  issuer: https://keycloak.example.com/realms/openshell
  clientId: openshell-dashboard
  existingSecret: openshell-dashboard-oidc
  codeChallengeMethod: S256
  adminRole: openshell-admin
  backendLogoutURL: "https://keycloak.example.com/realms/openshell/protocol/openid-connect/logout?id_token_hint={id_token}"
  allowedRoles:
    - openshell-api:openshell-admin
    - openshell-api:openshell-user

# Allows sign-out that ends the Keycloak session as well as the dashboard's.
# oidc.backendLogoutURL handles logout for keycloak backend while dashboard
# redirects to its own /oauth2/sign_in endpoint
# With values-port-forward.yaml, leave the authProxy blocks out.
authProxy:
  whitelistDomains: [keycloak.example.com]
