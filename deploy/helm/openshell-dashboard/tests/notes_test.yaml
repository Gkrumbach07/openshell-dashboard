suite: post-install notes
templates:
  - templates/NOTES.txt
values:
  - ../ci/values-keycloak.yaml
release:
  name: openshell-dashboard
  namespace: my-namespace
tests:
  - it: says nothing about sign-out when it ends the Keycloak session
    asserts:
      - notMatchRegexRaw:
          pattern: Sign-out ends only the dashboard session
  - it: warns when sign-out ends only the dashboard session
    set:
      oidc.provider: oidc
      oidc.allowedRoles: []
    asserts:
      - matchRegexRaw:
          pattern: Sign-out ends only the dashboard session
  - it: does not warn when sign-out sends the browser to the provider
    set:
      oidc.provider: oidc
      oidc.allowedRoles: []
      dashboard.logoutURL: /oauth2/sign_out?rd=https%3A%2F%2Fidp.example.com%2Flogout
    asserts:
      - notMatchRegexRaw:
          pattern: Sign-out ends only the dashboard session
