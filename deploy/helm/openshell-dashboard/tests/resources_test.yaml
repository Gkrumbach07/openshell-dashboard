suite: resource defaults and overrides
templates:
  - templates/serviceaccount.yaml
  - templates/service.yaml
  - templates/deployment.yaml
  - templates/networkpolicy.yaml
release:
  name: team-a
  namespace: tenant-a
set:
  oidc.issuer: https://idp.example.com/realms/openshell
tests:
  - it: creates a dedicated ServiceAccount without mounting its token
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: team-a-openshell-dashboard
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: uses the dedicated account without mounting its token in the pod
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: team-a-openshell-dashboard
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.replicas
          value: 1
  - it: applies a custom account name and annotations
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.name: dashboard-sa
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.name
          value: dashboard-sa
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
  - it: omits the ServiceAccount when using an existing account
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
  - it: uses an existing account when account creation is disabled
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: uses the default account when creation is disabled without a name
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
  - it: applies fullname override to Service while keeping dashboard identity
    template: templates/service.yaml
    set:
      fullnameOverride: custom-dashboard
      service.port: 8443
    asserts:
      - equal:
          path: metadata.name
          value: custom-dashboard
      - equal:
          path: spec.ports[0].port
          value: 8443
      - equal:
          path: spec.ports[0].targetPort
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: openshell-dashboard
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: team-a
  - it: does not append chart name when release already contains it
    template: templates/service.yaml
    release:
      name: openshell-dashboard
    asserts:
      - equal:
          path: metadata.name
          value: openshell-dashboard
  - it: adds safe pod labels and annotations without changing selectors
    template: templates/deployment.yaml
    set:
      podAnnotations:
        example.com/restarted: "yes"
      podLabels:
        team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/restarted"]
          value: "yes"
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
      - notExists:
          path: spec.selector.matchLabels.team
  - it: omits the admin role override unless explicitly configured
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'ADMIN_ROLE')]
  - it: passes a configured admin role to the dashboard only
    template: templates/deployment.yaml
    set:
      oidc.adminRole: platform-admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ROLE
            value: platform-admin
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name == 'ADMIN_ROLE')]
  - it: applies per-container resources and image pull policies
    template: templates/deployment.yaml
    set:
      global.image.pullPolicy: Always
      dashboard.image.pullPolicy: Never
      resources.requests.cpu: 100m
      authProxy.resources.limits.memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[1].resources.limits.memory
          value: 128Mi
  - it: configures pod scheduling and image pull secrets
    template: templates/deployment.yaml
    set:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: dashboard
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: []
      podLifecycle.terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-credentials
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - exists:
          path: spec.template.spec.affinity.nodeAffinity
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
  - it: loads a private OIDC CA only into the proxy
    template: templates/deployment.yaml
    set:
      oidc.caConfigMapName: private-idp-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --provider-ca-file=/etc/openshell/oidc/ca.crt
      - contains:
          path: spec.template.spec.containers[1].args
          content: --use-system-trust-store=true
      - equal:
          path: spec.template.spec.volumes[1].configMap.name
          value: private-idp-ca
      - equal:
          path: spec.template.spec.containers[1].volumeMounts[0].mountPath
          value: /etc/openshell/oidc
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[1]
  - it: mounts both gateway certificate files when client mTLS is enabled
    template: templates/deployment.yaml
    set:
      gateway.clientCertSecretName: client-identity
      oidc.allowedGroups: [operators]
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: client-identity
      - equal:
          path: spec.template.spec.volumes[1].secret.items[0].key
          value: tls.crt
      - equal:
          path: spec.template.spec.volumes[1].secret.items[1].key
          value: tls.key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].readOnly
          value: true
  - it: omits NetworkPolicy when disabled
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps the ingress policy scoped to the proxy port after a port override
    template: templates/networkpolicy.yaml
    set:
      authProxy.port: 9443
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9443
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP
